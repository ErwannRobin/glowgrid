<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>GlowGrid 5x5</title>

<style>
  body {
    background: #0f172a;
    color: white;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 40px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 70px);
    gap: 12px;
  }

  .cell {
    width: 70px;
    height: 70px;
    border-radius: 18px;
    background: rgba(255,255,255,0.05);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .on {
    background: radial-gradient(circle at 30% 30%, #67e8f9, #06b6d4);
    box-shadow: 0 0 20px #22d3ee, inset 0 0 12px white;
  }

  .previewPlus {
    outline: 3px solid #22c55e;
  }

  .previewCross {
    outline: 3px solid #f97316;
  }

  button {
    margin-top: 15px;
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
  }
</style>
</head>

<body>

<h2>GlowGrid 5×5</h2>
<div id="moves">Moves: 0</div>

<div class="grid" id="grid"></div>

<div>
  <button onclick="reset()">Reset</button>
  <button onclick="hint()">Hint</button>
</div>

<script>
const size = 5;
let moves = 0;

// état
let state = Array(size * size).fill(false);

// voisins +
function plusPattern(i) {
  const x = i % size;
  const y = Math.floor(i / size);
  const res = [i];

  if (x > 0) res.push(i - 1);
  if (x < size - 1) res.push(i + 1);
  if (y > 0) res.push(i - size);
  if (y < size - 1) res.push(i + size);

  return res;
}

// voisins X (diagonales)
function crossPattern(i) {
  const x = i % size;
  const y = Math.floor(i / size);
  const res = [i];

  if (x > 0 && y > 0) res.push(i - size - 1);
  if (x < size - 1 && y > 0) res.push(i - size + 1);
  if (x > 0 && y < size - 1) res.push(i + size - 1);
  if (x < size - 1 && y < size - 1) res.push(i + size + 1);

  return res;
}

function toggle(i) {
  state[i] = !state[i];
}

function clickCell(i) {
  const wasOn = state[i];

  const affected = wasOn ? plusPattern(i) : crossPattern(i);

  affected.forEach(toggle);

  moves++;
  update();
}

function update() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  state.forEach((on, i) => {
    const cell = document.createElement("div");
    cell.className = "cell" + (on ? " on" : "");

    // preview au hover
    cell.onmouseenter = () => preview(i, on);
    cell.onmouseleave = clearPreview;

    cell.onclick = () => clickCell(i);

    grid.appendChild(cell);
  });

  document.getElementById("moves").innerText = "Moves: " + moves;

  checkWin();
}

function preview(i, isOn) {
  clearPreview();

  const pattern = isOn ? plusPattern(i) : crossPattern(i);
  const grid = document.getElementById("grid").children;

  pattern.forEach(j => {
    grid[j].classList.add(isOn ? "previewPlus" : "previewCross");
  });
}

function clearPreview() {
  const cells = document.getElementById("grid").children;
  for (let c of cells) {
    c.classList.remove("previewPlus", "previewCross");
  }
}

function checkWin() {
  if (state.every(v => v)) {
    setTimeout(() => alert("🎉 Tout allumé en " + moves + " coups !"), 100);
  }
}

// génération simple (à améliorer ensuite)
function generatePuzzle(steps = 8) {
  state = Array(size * size).fill(true);

  for (let k = 0; k < steps; k++) {
    const i = Math.floor(Math.random() * state.length);
    clickCell(i);
  }

  moves = 0;
}

function reset() {
  generatePuzzle(8);
  update();
}

// hint simple
function hint() {
  let best = 0;
  let bestScore = -1;

  for (let i = 0; i < state.length; i++) {
    const pattern = state[i] ? plusPattern(i) : crossPattern(i);

    let score = pattern.filter(j => !state[j]).length;

    if (score > bestScore) {
      bestScore = score;
      best = i;
    }
  }

  const grid = document.getElementById("grid").children;
  grid[best].classList.add("previewPlus");

  setTimeout(clearPreview, 800);

  moves++; // pénalité
}

generatePuzzle();
update();
</script>

</body>
</html>
