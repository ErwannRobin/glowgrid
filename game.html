<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>GlowGrid 5x5</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at 30% 20%, #1e293b, #020617);
    font-family: -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
  }

  h2 {
    margin-bottom: 10px;
    opacity: 0.9;
    letter-spacing: 1px;
  }

  #moves {
    margin-bottom: 20px;
    opacity: 0.6;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 80px);
    gap: 14px;
  }

  .cell {
    width: 80px;
    height: 80px;
    border-radius: 22px;

    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(12px);

    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.15),
      inset 0 -2px 6px rgba(0,0,0,0.5),
      0 8px 20px rgba(0,0,0,0.4);

    cursor: pointer;
    transition: all 0.25s ease;
  }

  .cell:hover {
    transform: translateY(-4px) scale(1.03);
  }

  .cell:active {
    transform: scale(0.95);
  }

  .on {
    background:
      radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(34,211,238,0.6) 40%, rgba(6,182,212,0.3) 70%);

    box-shadow:
      0 0 20px rgba(34,211,238,0.8),
      0 0 40px rgba(34,211,238,0.4),
      inset 0 0 20px rgba(255,255,255,0.8);
  }

  /* halo preview */
  .previewPlus {
    box-shadow:
      0 0 15px rgba(34,197,94,0.8),
      0 0 30px rgba(34,197,94,0.4),
      inset 0 0 10px rgba(255,255,255,0.5);
  }

  .previewCross {
    box-shadow:
      0 0 15px rgba(249,115,22,0.8),
      0 0 30px rgba(249,115,22,0.4),
      inset 0 0 10px rgba(255,255,255,0.5);
  }

  button {
    margin-top: 18px;
    padding: 10px 18px;
    border-radius: 12px;
    border: none;
    background: rgba(255,255,255,0.08);
    color: white;
    backdrop-filter: blur(10px);
    cursor: pointer;

    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.2),
      0 6px 15px rgba(0,0,0,0.4);

    transition: all 0.2s ease;
  }

  button:hover {
    background: rgba(255,255,255,0.15);
  }
</style>
</head>

<body>

<h2>GlowGrid 5×5</h2>
<div id="moves">Moves: 0</div>

<div class="grid" id="grid"></div>

<div>
  <button onclick="reset()">Reset</button>
  <button onclick="hint()">Hint</button>
</div>

<script>
const size = 5;
let moves = 0;

// état
let state = Array(size * size).fill(false);

// voisins +
function plusPattern(i) {
  const x = i % size;
  const y = Math.floor(i / size);
  const res = [i];

  if (x > 0) res.push(i - 1);
  if (x < size - 1) res.push(i + 1);
  if (y > 0) res.push(i - size);
  if (y < size - 1) res.push(i + size);

  return res;
}

// voisins X (diagonales)
function crossPattern(i) {
  const x = i % size;
  const y = Math.floor(i / size);
  const res = [i];

  if (x > 0 && y > 0) res.push(i - size - 1);
  if (x < size - 1 && y > 0) res.push(i - size + 1);
  if (x > 0 && y < size - 1) res.push(i + size - 1);
  if (x < size - 1 && y < size - 1) res.push(i + size + 1);

  return res;
}

function toggle(i) {
  state[i] = !state[i];
}

function clickCell(i) {
  const wasOn = state[i];

  const affected = wasOn ? plusPattern(i) : crossPattern(i);

  affected.forEach(toggle);

  moves++;
  update();
}

function update() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  state.forEach((on, i) => {
    const cell = document.createElement("div");
    cell.className = "cell" + (on ? " on" : "");

    // preview au hover
    cell.onmouseenter = () => preview(i, on);
    cell.onmouseleave = clearPreview;

    cell.onclick = () => clickCell(i);

    grid.appendChild(cell);
  });

  document.getElementById("moves").innerText = "Moves: " + moves;

  checkWin();
}

function preview(i, isOn) {
  clearPreview();

  const pattern = isOn ? plusPattern(i) : crossPattern(i);
  const grid = document.getElementById("grid").children;

  pattern.forEach(j => {
    grid[j].classList.add(isOn ? "previewPlus" : "previewCross");
  });
}

function clearPreview() {
  const cells = document.getElementById("grid").children;
  for (let c of cells) {
    c.classList.remove("previewPlus", "previewCross");
  }
}

function checkWin() {
  if (state.every(v => v)) {
    setTimeout(() => alert("🎉 Tout allumé en " + moves + " coups !"), 100);
  }
}

// génération simple (à améliorer ensuite)
function generatePuzzle(steps = 8) {
  state = Array(size * size).fill(true);

  for (let k = 0; k < steps; k++) {
    const i = Math.floor(Math.random() * state.length);
    clickCell(i);
  }

  moves = 0;
}

function reset() {
  generatePuzzle(8);
  update();
}

// hint simple
function hint() {
  let best = 0;
  let bestScore = -1;

  for (let i = 0; i < state.length; i++) {
    const pattern = state[i] ? plusPattern(i) : crossPattern(i);

    let score = pattern.filter(j => !state[j]).length;

    if (score > bestScore) {
      bestScore = score;
      best = i;
    }
  }

  const grid = document.getElementById("grid").children;
  grid[best].classList.add("previewPlus");

  setTimeout(clearPreview, 800);

  moves++; // pénalité
}

generatePuzzle();
update();
</script>

</body>
</html>
