<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>GlowGrid 5x5</title>

<style>
  body {
    margin: 0;
    height: 100vh;

    background:
      radial-gradient(circle at top, #ffffff, #eef2f7);

    font-family: -apple-system, BlinkMacSystemFont, sans-serif;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    color: #334155;
  }

  h2 {
    font-weight: 500;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
    opacity: 0.8;
  }

  #moves {
    margin-bottom: 24px;
    opacity: 0.45;
    font-size: 14px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 74px);
    gap: 14px;
  }

  .cell {
    width: 74px;
    height: 74px;

    border-radius: 22px;

    background: rgba(255,255,255,0.35);

    backdrop-filter: blur(18px);

    border: 1px solid rgba(255,255,255,0.6);

    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.7),
      0 2px 10px rgba(148,163,184,0.08);

    transition:
      transform 0.18s ease,
      background 0.25s ease,
      box-shadow 0.25s ease;

    cursor: pointer;
  }

  .cell:hover {
    transform: scale(1.02);
  }

  .cell:active {
    transform: scale(0.97);
  }

  .on {
    background:
      radial-gradient(
        circle at 50% 50%,
        rgba(255,255,255,0.95),
        rgba(186,230,253,0.55)
      );

    border: 1px solid rgba(255,255,255,0.9);

    box-shadow:
      0 0 18px rgba(186,230,253,0.35),
      inset 0 1px 2px rgba(255,255,255,0.9);
  }

  .previewPlus {
    box-shadow:
      0 0 0 2px rgba(34,197,94,0.18),
      0 0 12px rgba(34,197,94,0.12);
  }

  .previewCross {
    box-shadow:
      0 0 0 2px rgba(249,115,22,0.16),
      0 0 12px rgba(249,115,22,0.10);
  }

  button {
    margin-top: 20px;

    padding: 10px 16px;

    border-radius: 14px;

    border: 1px solid rgba(255,255,255,0.7);

    background: rgba(255,255,255,0.45);

    backdrop-filter: blur(12px);

    color: #475569;

    font-size: 14px;

    cursor: pointer;

    transition: all 0.2s ease;
  }

  button:hover {
    background: rgba(255,255,255,0.65);
  }
</style>
</head>

<body>

<h2>GlowGrid 5×5</h2>
<div id="moves">Moves: 0</div>

<div class="grid" id="grid"></div>

<div>
  <button onclick="reset()">Reset</button>
  <button onclick="hint()">Hint</button>
</div>

<script>
const size = 5;
let moves = 0;

// état
let state = Array(size * size).fill(false);

// voisins +
function plusPattern(i) {
  const x = i % size;
  const y = Math.floor(i / size);
  const res = [i];

  if (x > 0) res.push(i - 1);
  if (x < size - 1) res.push(i + 1);
  if (y > 0) res.push(i - size);
  if (y < size - 1) res.push(i + size);

  return res;
}

// voisins X (diagonales)
function crossPattern(i) {
  const x = i % size;
  const y = Math.floor(i / size);
  const res = [i];

  if (x > 0 && y > 0) res.push(i - size - 1);
  if (x < size - 1 && y > 0) res.push(i - size + 1);
  if (x > 0 && y < size - 1) res.push(i + size - 1);
  if (x < size - 1 && y < size - 1) res.push(i + size + 1);

  return res;
}

function toggle(i) {
  state[i] = !state[i];
}

function clickCell(i) {
  const wasOn = state[i];

  const affected = wasOn ? plusPattern(i) : crossPattern(i);

  affected.forEach(toggle);

  moves++;
  update();
}

function update() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  state.forEach((on, i) => {
    const cell = document.createElement("div");
    cell.className = "cell" + (on ? " on" : "");

    // preview au hover
    cell.onmouseenter = () => preview(i, on);
    cell.onmouseleave = clearPreview;

    cell.onclick = () => clickCell(i);

    grid.appendChild(cell);
  });

  document.getElementById("moves").innerText = "Moves: " + moves;

  checkWin();
}

function preview(i, isOn) {
  clearPreview();

  const pattern = isOn ? plusPattern(i) : crossPattern(i);
  const grid = document.getElementById("grid").children;

  pattern.forEach(j => {
    grid[j].classList.add(isOn ? "previewPlus" : "previewCross");
  });
}

function clearPreview() {
  const cells = document.getElementById("grid").children;
  for (let c of cells) {
    c.classList.remove("previewPlus", "previewCross");
  }
}

function checkWin() {
  if (state.every(v => v)) {
    setTimeout(() => alert("🎉 Tout allumé en " + moves + " coups !"), 100);
  }
}

// génération simple (à améliorer ensuite)
function generatePuzzle(steps = 8) {
  state = Array(size * size).fill(true);

  for (let k = 0; k < steps; k++) {
    const i = Math.floor(Math.random() * state.length);
    clickCell(i);
  }

  moves = 0;
}

function reset() {
  generatePuzzle(8);
  update();
}

// hint simple
function hint() {
  let best = 0;
  let bestScore = -1;

  for (let i = 0; i < state.length; i++) {
    const pattern = state[i] ? plusPattern(i) : crossPattern(i);

    let score = pattern.filter(j => !state[j]).length;

    if (score > bestScore) {
      bestScore = score;
      best = i;
    }
  }

  const grid = document.getElementById("grid").children;
  grid[best].classList.add("previewPlus");

  setTimeout(clearPreview, 800);

  moves++; // pénalité
}

generatePuzzle();
update();
</script>

</body>
</html>
