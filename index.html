<style>
/* ── Fluid sizing tokens ── */
:root {
  --cell: clamp(52px, 13.5vw, 70px);
  --gap:  clamp(7px, 2vw, 12px);
  --cell-r: clamp(12px, 3.5vw, 20px);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0a0f1e;
  color: #e2e8f0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
  position: relative;
  padding: 24px 16px;
}

/* ── Animated background ── */
.bg-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(90px);
  opacity: 0.12;
  pointer-events: none;
  animation: orb-drift 22s ease-in-out infinite;
}
.bg-orb:nth-child(1) {
  width: 500px; height: 500px;
  background: #3b82f6;
  top: -150px; left: -150px;
  animation-delay: 0s;
}
.bg-orb:nth-child(2) {
  width: 350px; height: 350px;
  background: #8b5cf6;
  bottom: -80px; right: -80px;
  animation-delay: -8s;
}
.bg-orb:nth-child(3) {
  width: 250px; height: 250px;
  background: #06b6d4;
  bottom: 25%; left: 8%;
  animation-delay: -16s;
}

@keyframes orb-drift {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33%       { transform: translate(40px, -30px) scale(1.06); }
  66%       { transform: translate(-25px, 40px) scale(0.94); }
}

/* ── Layout ── */
.container {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(14px, 3.5vw, 22px);
  width: 100%;
  max-width: 480px;
}

/* ── Header ── */
.title {
  font-size: clamp(24px, 6.5vw, 30px);
  font-weight: 700;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, #e2e8f0 30%, #64748b);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-align: center;
  line-height: 1;
  display: block;
  cursor: pointer;
}

.subtitle {
  font-size: 11px;
  color: #334155;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-top: 5px;
  text-align: center;
}

/* ── Date navigation ── */
.date-nav {
  display: flex;
  align-items: center;
  gap: 10px;
}

.nav-btn {
  width: 36px;
  height: 36px;
  min-width: 44px;
  min-height: 44px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.07);
  background: rgba(255,255,255,0.04);
  color: #475569;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
  padding: 0;
  line-height: 1;
}

.nav-btn:hover:not(:disabled) {
  background: rgba(255,255,255,0.08);
  color: #94a3b8;
  border-color: rgba(255,255,255,0.13);
}

.nav-btn:disabled {
  opacity: 0.2;
  cursor: not-allowed;
}

.puzzle-label {
  font-size: 12px;
  color: #334155;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  text-align: center;
  min-width: 140px;
}

/* ── Stats ── */
.stats {
  display: flex;
  gap: 28px;
  align-items: center;
}

.stat { text-align: center; }

.stat-value {
  font-size: clamp(20px, 5vw, 24px);
  font-weight: 600;
  color: #e2e8f0;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.stat-label {
  font-size: 10px;
  color: #334155;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-top: 3px;
}

.stat-divider {
  width: 1px;
  height: 34px;
  background: rgba(255,255,255,0.06);
}

/* ── Grid ── */
.grid {
  display: grid;
  grid-template-columns: repeat(5, var(--cell));
  gap: var(--gap);
  user-select: none;
  -webkit-user-select: none;
}

/* ── Cell ── */
.cell {
  width: var(--cell);
  height: var(--cell);
  border-radius: var(--cell-r);
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.07);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.04),
    0 6px 20px rgba(0,0,0,0.4);
  cursor: pointer;
  touch-action: manipulation;
  position: relative;
  overflow: hidden;
  transition:
    transform 0.15s ease,
    background 0.22s ease,
    border-color 0.22s ease,
    box-shadow 0.22s ease;
  outline: none;
}

.cell.cell-entering {
  animation: cell-in 0.35s ease both;
  animation-delay: calc(var(--idx) * 18ms);
}

@keyframes cell-in {
  from { opacity: 0; transform: scale(0.75); }
  to   { opacity: 1; transform: scale(1); }
}

.cell:hover {
  transform: translateY(-2px) scale(1.04);
  border-color: rgba(255,255,255,0.14);
}

.cell:active { transform: scale(0.94); }

.cell:focus-visible {
  outline: 2px solid rgba(96,165,250,0.55);
  outline-offset: 2px;
}

/* ON state — each cell gets its color from --hue/--sat/--light custom properties */
.cell.on {
  background: radial-gradient(
    circle at 38% 32%,
    hsl(var(--hue), calc(var(--sat) - 15%), calc(var(--light) + 20%)),
    hsl(var(--hue), var(--sat), var(--light)) 55%,
    hsl(var(--hue), calc(var(--sat) + 5%), calc(var(--light) - 10%))
  );
  border-color: rgba(255,255,255,0.45);
  box-shadow:
    0 0 22px hsla(var(--hue), var(--sat), var(--light), 0.5),
    0 0 50px hsla(var(--hue), var(--sat), var(--light), 0.18),
    inset 0 1px 2px rgba(255,255,255,0.45);
}

.cell.on::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(circle at 28% 28%, rgba(255,255,255,0.35), transparent 58%);
  pointer-events: none;
}

/* Preview highlight */
.cell.preview {
  border-color: hsla(var(--hue), 90%, 75%, 0.9);
  box-shadow:
    0 0 0 3px hsla(var(--hue), 90%, 75%, 0.45),
    0 0 22px hsla(var(--hue), 85%, 65%, 0.35),
    0 6px 20px rgba(0,0,0,0.4);
  transform: scale(1.05);
  filter: brightness(1.25);
}

/* Click ripple */
.ripple {
  position: absolute;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,0.22);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0);
  animation: ripple-out 0.38s ease-out forwards;
  pointer-events: none;
}

@keyframes ripple-out {
  to { transform: translate(-50%, -50%) scale(3.2); opacity: 0; }
}

/* ── Action buttons ── */
.actions {
  display: flex;
  gap: 10px;
}

.btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 11px 16px;
  min-height: 44px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.05);
  color: #64748b;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.18s ease;
  backdrop-filter: blur(8px);
  letter-spacing: 0.1px;
}

.btn:hover {
  background: rgba(255,255,255,0.09);
  color: #94a3b8;
  border-color: rgba(255,255,255,0.13);
}

.btn:active { transform: scale(0.96); }

.btn:disabled, .btn[aria-disabled="true"] {
  opacity: 0.3;
  cursor: default;
}

@media (pointer: coarse) {
  .kbd-hint { display: none; }
}

@keyframes hint-pulse {
  0%, 100% { box-shadow: none; border-color: rgba(255,255,255,0.08); color: #64748b; }
  50%       { box-shadow: 0 0 0 4px rgba(59,130,246,0.18); border-color: rgba(59,130,246,0.45); color: #60a5fa; }
}

.btn-hint.hint-ready {
  animation: hint-pulse 1.8s ease-in-out infinite;
}

@keyframes hint-ring {
  0%, 100% {
    box-shadow: 0 0 0 3px hsla(var(--hue,220), 90%, 70%, 0.95), 0 0 24px hsla(var(--hue,220), 85%, 60%, 0.55), inset 0 0 12px hsla(var(--hue,220), 85%, 60%, 0.3);
    transform: scale(1.02);
  }
  50% {
    box-shadow: 0 0 0 8px hsla(var(--hue,220), 90%, 70%, 0.4), 0 0 50px hsla(var(--hue,220), 85%, 60%, 0.75), inset 0 0 22px hsla(var(--hue,220), 85%, 60%, 0.5);
    transform: scale(1.1);
  }
}

.cell.hint-highlight {
  animation: hint-ring 0.9s ease-in-out infinite !important;
  border-color: rgba(255,255,255,0.95) !important;
  filter: brightness(1.3);
  z-index: 2;
}

.hint-info {
  font-size: 12px;
  color: #60a5fa;
  letter-spacing: 0.2px;
  text-align: center;
  opacity: 0.9;
  min-height: 20px;
  visibility: hidden;
}
.hint-info.visible {
  visibility: visible;
}

/* ── Win overlay ── */
.win-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(14px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
}

.win-overlay.visible {
  opacity: 1;
  pointer-events: all;
}

.win-card {
  background: rgba(10,15,30,0.92);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 28px;
  padding: clamp(24px, 5vw, 40px) clamp(20px, 6vw, 48px);
  width: min(calc(100vw - 32px), 400px);
  text-align: center;
  transform: scale(0.82) translateY(24px);
  transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow:
    0 0 70px rgba(59,130,246,0.18),
    0 28px 60px rgba(0,0,0,0.5);
}

.win-overlay.visible .win-card {
  transform: scale(1) translateY(0);
}

.win-emoji {
  font-size: 48px;
  display: block;
  margin-bottom: 12px;
  animation: emoji-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
}

@keyframes emoji-pop {
  from { transform: scale(0) rotate(-15deg); }
  to   { transform: scale(1) rotate(0deg); }
}

.win-title {
  font-size: 26px;
  font-weight: 700;
  color: #e2e8f0;
  letter-spacing: -0.3px;
  margin-bottom: 4px;
}

.win-caption {
  font-size: 13px;
  color: #334155;
  margin-bottom: 20px;
}

/* ── Win view toggle ── */
.win-view-toggle {
  display: flex;
  justify-content: center;
  gap: 2px;
  margin-bottom: 14px;
  background: rgba(255,255,255,0.06);
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.08);
  overflow: hidden;
  width: fit-content;
  margin-left: auto;
  margin-right: auto;
  padding: 3px;
}

.win-view-tab {
  padding: 7px 18px;
  font-size: 13px;
  font-weight: 600;
  color: rgba(255,255,255,0.4);
  background: none;
  border: none;
  border-radius: 9px;
  cursor: pointer;
  transition: all 0.2s ease;
  letter-spacing: 0.2px;
}

.win-view-tab.active {
  color: #fff;
  background: rgba(255,255,255,0.1);
}

.win-view-tab:hover:not(.active) {
  color: rgba(255,255,255,0.6);
}

/* Mini grid preview in win overlay */
.win-grid {
  display: grid;
  grid-template-columns: repeat(5, 34px);
  gap: 5px;
  margin: 0 auto 8px;
  width: fit-content;
}

.win-grid-cell {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: rgba(255,255,255,0.55);
  transition: background 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease, transform 0.12s ease;
}

/* Replay ON/OFF states for mini grid */
.win-grid.replay-mode .win-grid-cell {
  font-size: 0;
  color: transparent;
}

.win-grid.replay-mode .win-grid-cell.cell-on {
  background: radial-gradient(
    circle at 38% 32%,
    hsl(var(--hue), calc(var(--sat) - 15%), calc(var(--light) + 20%)),
    hsl(var(--hue), var(--sat), var(--light)) 55%,
    hsl(var(--hue), calc(var(--sat) + 5%), calc(var(--light) - 10%))
  );
  border-color: hsla(var(--hue), var(--sat), calc(var(--light) + 15%), 0.5);
  box-shadow: 0 0 10px hsla(var(--hue), var(--sat), var(--light), 0.4);
}

.win-grid.replay-mode .win-grid-cell.cell-off {
  background: rgba(255,255,255,0.04);
  border-color: rgba(255,255,255,0.06);
  box-shadow: none;
}

.win-grid.replay-mode .win-grid-cell.cell-clicked {
  transform: scale(1.18);
  border-color: rgba(250,204,21,0.7);
  box-shadow: 0 0 12px rgba(250,204,21,0.4);
  z-index: 1;
}

/* ── Replay progress bar ── */
.replay-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 10px auto 6px;
  width: calc(5 * 34px + 4 * 5px + 20px); /* wider than grid */
}

.replay-play-btn {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  border: none;
  background: none;
  color: rgba(255,255,255,0.7);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
  flex-shrink: 0;
  padding: 0;
}

.replay-play-btn:hover {
  color: #fff;
}

.replay-track {
  flex: 1;
  height: 5px;
  background: rgba(255,255,255,0.1);
  border-radius: 3px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.replay-track-fill {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  background: rgba(255,255,255,0.45);
  border-radius: 3px;
  transition: width 0.1s ease;
}

.win-moves-line {
  font-size: 13px;
  color: #475569;
  margin-bottom: 8px;
  font-variant-numeric: tabular-nums;
}

.win-hints-line {
  font-size: 12px;
  color: #60a5fa;
  margin-bottom: 14px;
  font-weight: 500;
}

/* Streak badge in win overlay */
.win-streak {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 600;
  color: #fb923c;
  background: rgba(251,146,60,0.08);
  border: 1px solid rgba(251,146,60,0.18);
  border-radius: 8px;
  padding: 4px 12px;
  margin-bottom: 22px;
  letter-spacing: 0.2px;
}

.win-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  align-items: center;
}

.btn-share {
  padding: 13px 24px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.85);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s ease;
  letter-spacing: 0.2px;
}

.btn-share:hover {
  background: rgba(255,255,255,0.14);
  color: #fff;
  border-color: rgba(255,255,255,0.25);
}

.btn-share:active { transform: scale(0.96); }

.btn-replay {
  padding: 12px 18px;
  border-radius: 14px;
  border: 1px solid rgba(96,165,250,0.25);
  background: rgba(96,165,250,0.07);
  color: #60a5fa;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s ease;
  letter-spacing: 0.1px;
}

.btn-replay:hover {
  background: rgba(96,165,250,0.14);
  border-color: rgba(96,165,250,0.4);
}

.btn-replay:active { transform: scale(0.96); }

.btn-replay:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

@keyframes replay-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(96,165,250,0.3); }
  50%       { box-shadow: 0 0 0 6px rgba(96,165,250,0); }
}

.btn-replay.replaying {
  animation: replay-pulse 0.5s ease-in-out infinite;
}

.btn-play-again {
  background: linear-gradient(135deg, #3b82f6, #6366f1);
  color: white;
  border: none;
  padding: 13px 24px;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 4px 24px rgba(59,130,246,0.38);
  letter-spacing: 0.2px;
}

.btn-play-again:hover {
  transform: translateY(-2px);
  box-shadow: 0 7px 28px rgba(59,130,246,0.5);
}

.btn-play-again:active { transform: scale(0.97); }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 36px;
  left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: #1e293b;
  border: 1px solid rgba(255,255,255,0.09);
  color: #94a3b8;
  font-size: 13px;
  font-weight: 500;
  padding: 9px 22px;
  border-radius: 12px;
  opacity: 0;
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none;
  z-index: 200;
  white-space: nowrap;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── Confetti particles ── */
.particle {
  position: fixed;
  pointer-events: none;
  z-index: 101;
  border-radius: 50%;
  animation: particle-fly var(--dur) ease-out var(--delay) both;
}

@keyframes particle-fly {
  0%   { transform: translate(0, 0) scale(1); opacity: 1; }
  100% { transform: translate(var(--tx), var(--ty)) scale(0.2); opacity: 0; }
}

/* ── Sound controls ── */
.sound-ctrl {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 8px;
}

.sound-toggle {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.05);
  color: #64748b;
  font-size: 17px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
  backdrop-filter: blur(8px);
  line-height: 1;
}

.sound-toggle:hover {
  background: rgba(255,255,255,0.09);
  color: #94a3b8;
  border-color: rgba(255,255,255,0.13);
}

.sound-toggle.sound-on {
  color: #60a5fa;
  border-color: rgba(96,165,250,0.3);

<script>
const SIZE = 5;
const MAX_DAYS_BACK = 60;

let state = [];
let moves = 0;
let clickCounts = new Array(SIZE * SIZE).fill(0); // raw click count per cell
let moveHistory = []; // {cellIndex, cellWasOn} per click — for end-game replay
let cells = [];
let puzzleState = null; // initial state for current puzzle (for Reset)
let currentDateKey = ''; // "YYYY-M-D"

let hintsUsed = 0;        // hints consumed this puzzle
let activeHintCell = -1;  // currently highlighted cell (-1 = none)
let stuckTimer = null;    // setTimeout handle for stuck detection
const STUCK_DELAY = 20000; // 20s idle with ≤3 cells OFF → pulse hint button

// ── Song Challenge Mode ──────────────────────────────────────

// Cell mapping: col = note (C=0 D=1 E=2 G=3 A=4), row = octave multiplier
// Row 0 (×0.5): C3=0  D3=1  E3=2  G3=3  A3=4
// Row 2 (×1.0): C4=10 D4=11 E4=12 G4=13 A4=14
// Row 4 (×2.0): C5=20 D5=21 E5=22 G5=23 A5=24

const SONGS = {

    ],

  },
  'hot-cross-buns': {
    title: 'Hot Cross Buns',
    bpm: 110,
    // E4 D4 C4 | E4 D4 C4 | C3 C4 C5 C3 | D3 D4 D5 D3 | E4 D4 C4
    melody: [
      { cell: 12, beats: 1 },
      { cell: 11, beats: 1 },
      { cell: 10, beats: 2 },
      { cell: 12, beats: 1 },
      { cell: 11, beats: 1 },
      { cell: 10, beats: 2 },
      { cell: 0,  beats: 0.5 },
      { cell: 10, beats: 0.5 },

      { cell: 0,  beats: 0.5 },
      { cell: 1,  beats: 0.5 },
      { cell: 11, beats: 0.5 },
      { cell: 21, beats: 0.5 },

    ],

  },
  'swing-low': {

    bpm: 80,
    // G3 C4 C4 E4 | D4 C4 E4 | D4 C4 A3 G3 | A3 C4 C4 D4 E4
    melody: [
      { cell: 3,  beats: 0.5 },

      { cell: 10, beats: 1 },
      { cell: 4,  beats: 0.5 },

  },
};

// Detect song mode from URL
const _songParam = new URLSearchParams(location.search).get('song');
const _activeSong = _songParam && SONGS[_songParam] ? SONGS[_songParam] : null;
const isSongMode = !!_activeSong;

function openSongPicker() {
  const list = document.getElementById('song-list');
  list.innerHTML = '';
  for (const [id, song] of Object.entries(SONGS)) {
    const item = document.createElement('a');
    item.className = 'song-item';
    item.href = `?song=${id}`;
    item.innerHTML = `<span class="song-item-title">${song.title}</span><span class="song-item-info">${song.melody.length} notes</span>`;

  }

function closeSongPicker() {
  document.getElementById('song-overlay').classList.remove('visible');
}

// Close on backdrop click
document.getElementById('song-overlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeSongPicker();
});

// ── Seeded PRNG (mulberry32) ─────────────────────────────────

function mulberry32(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ── Date helpers ─────────────────────────────────────────────

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

function dateFromKey(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function seedFromKey(key) {
  const [y, m, d] = key.split('-').map(Number);
  return y * 10000 + m * 100 + d;
}

function puzzleNumberFromKey(key) {
  const [y, m, d] = key.split('-').map(Number);
  const epoch  = Date.UTC(2025, 0, 1);
  const target = Date.UTC(y, m - 1, d);
  return Math.max(1, Math.floor((target - epoch) / 86400000) + 1);
}

function keyFromPuzzleNumber(num) {
  const d = new Date(Date.UTC(2025, 0, 1) + (num - 1) * 86400000);
  return `${d.getUTCFullYear()}-${d.getUTCMonth() + 1}-${d.getUTCDate()}`;
}

function formatDateLabel(key) {
  if (key === todayKey()) return 'Today';
  return dateFromKey(key).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function offsetDate(key, delta) {
  const d = dateFromKey(key);
  d.setDate(d.getDate() + delta);
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

function compareDateKeys(a, b) {
  const da = dateFromKey(a), db = dateFromKey(b);
  return da.getTime() - db.getTime();
}

// ── Streak ───────────────────────────────────────────────────

function getStreak() {
  return parseInt(localStorage.getItem('glowgrid-streak') || '0');
}

function tryUpdateStreak() {
  if (currentDateKey !== todayKey()) return false;

  const lastDate = localStorage.getItem('glowgrid-last-streak-date');
  const today = todayKey();
  if (lastDate === today) return false; // already counted today

  const streak = getStreak();
  const yesterday = offsetDate(today, -1);
  const newStreak = lastDate === yesterday ? streak + 1 : 1;

  localStorage.setItem('glowgrid-streak', newStreak);
  localStorage.setItem('glowgrid-last-streak-date', today);
  return true;
}

function refreshStreakDisplay() {
  const s = getStreak();
  document.getElementById('streak-val').textContent = s > 0 ? s : '—';
}

// ── Patterns ────────────────────────────────────────────────

function plusPattern(i) {
  const x = i % SIZE, y = Math.floor(i / SIZE);
  const r = [i];
  if (x > 0)        r.push(i - 1);
  if (x < SIZE - 1) r.push(i + 1);
  if (y > 0)        r.push(i - SIZE);
  if (y < SIZE - 1) r.push(i + SIZE);
  return r;
}

function crossPattern(i) {
  const x = i % SIZE, y = Math.floor(i / SIZE);
  const r = [i];
  if (x > 0 && y > 0)           r.push(i - SIZE - 1);
  if (x < SIZE-1 && y > 0)      r.push(i - SIZE + 1);
  if (x > 0 && y < SIZE-1)      r.push(i + SIZE - 1);
  if (x < SIZE-1 && y < SIZE-1) r.push(i + SIZE + 1);
  return r;
}

function affectedCells(i) {
  return state[i] ? plusPattern(i) : crossPattern(i);
}

function applyToggle(i) {
  affectedCells(i).forEach(j => { state[j] = !state[j]; });
}

// ── Solver (bidirectional BFS) ────────────────────────────────

// Precompute XOR masks from existing pattern functions (stays in sync with gameplay)
const plusMasks  = Array.from({length: SIZE * SIZE}, (_, i) => {
  let m = 0; plusPattern(i).forEach(j => { m |= (1 << j); }); return m >>> 0;
});
const crossMasks = Array.from({length: SIZE * SIZE}, (_, i) => {
  let m = 0; crossPattern(i).forEach(j => { m |= (1 << j); }); return m >>> 0;
});

function stateToBits(st) {
  let bits = 0;
  for (let i = 0; i < SIZE * SIZE; i++) if (st[i]) bits |= (1 << i);
  return bits >>> 0;
}

// Forward move: apply the same pattern logic as the actual game
function applyMoveToBits(bits, move) {
  return (bits ^ (bits & (1 << move) ? plusMasks[move] : crossMasks[move])) >>> 0;
}

// Reverse move: given result state `bits`, what state transitions TO `bits` via `move`?
// Since clicking always flips the cell, if bits[move]=1 then before click it was 0 (used cross);
// if bits[move]=0 then before click it was 1 (used plus).
function applyRevMoveToBits(bits, move) {
  return (bits ^ (bits & (1 << move) ? crossMasks[move] : plusMasks[move])) >>> 0;
}

function onBitCount(bits) {
  let n = 0;
  for (let i = 0; i < SIZE * SIZE; i++) if (bits & (1 << i)) n++;
  return n;
}

function bidirBFSSolve(stArr) {
  const GOAL = ((1 << (SIZE * SIZE)) - 1) >>> 0;
  const initBits = stateToBits(stArr);
  if (initBits === GOAL) return [];

  const MAX_TOTAL = 300000;
  const deadline = performance.now() + 400;

  // Forward: state → [parentBits, move] | null
  const fPrev = new Map();
  fPrev.set(initBits, null);
  let fFrontier = [initBits];

  // Backward: state → [nextBits, move] | null (where clicking move from state → nextBits)
  const bPrev = new Map();
  bPrev.set(GOAL, null);
  let bFrontier = [GOAL];

  function reconstruct(meeting) {
    const path = [];
    let cur = meeting;
    while (fPrev.get(cur) !== null) {
      const [p, m] = fPrev.get(cur);
      path.unshift(m);
      cur = p;
    }
    cur = meeting;
    while (bPrev.get(cur) !== null) {
      const [next, m] = bPrev.get(cur);
      path.push(m);
      cur = next;
    }
    return path;
  }

  while (fFrontier.length > 0 || bFrontier.length > 0) {
    if (fPrev.size + bPrev.size >= MAX_TOTAL || performance.now() > deadline) break;

    // Expand forward one level
    const nextF = [];
    for (const bits of fFrontier) {
      for (let move = 0; move < SIZE * SIZE; move++) {
        const nb = applyMoveToBits(bits, move);
        if (!fPrev.has(nb)) {
          fPrev.set(nb, [bits, move]);
          if (bPrev.has(nb)) return reconstruct(nb);
          nextF.push(nb);
        }
      }
    }
    fFrontier = nextF;

    if (fPrev.size + bPrev.size >= MAX_TOTAL || performance.now() > deadline) break;

    // Expand backward one level
    const nextB = [];
    for (const bits of bFrontier) {
      for (let move = 0; move < SIZE * SIZE; move++) {
        const nb = applyRevMoveToBits(bits, move);
        if (!bPrev.has(nb)) {
          bPrev.set(nb, [bits, move]);
          if (fPrev.has(nb)) return reconstruct(nb);
          nextB.push(nb);
        }
      }
    }
    bFrontier = nextB;
  }
  return null;
}

// Greedy fallback: pick the move that maximises ON cells
function greedyHint(stArr) {
  const bits = stateToBits(stArr);
  let bestMove = 0, bestOn = -1;
  for (let i = 0; i < SIZE * SIZE; i++) {
    const on = onBitCount(applyMoveToBits(bits, i));
    if (on > bestOn) { bestOn = on; bestMove = i; }
  }
  return [bestMove];
}

// ── Hint management ───────────────────────────────────────────

function clearHintHighlight() {
  if (activeHintCell >= 0 && cells[activeHintCell]) {
    cells[activeHintCell].classList.remove('hint-highlight');
  }
  activeHintCell = -1;
}

function resetHintState() {
  clearTimeout(stuckTimer);
  stuckTimer = null;
  clearHintHighlight();
  hintPath = null;
  hintStep = 0;
  const el = document.getElementById('hint-info');
  if (el) el.classList.remove('visible');
}

function checkStuck() {
  clearTimeout(stuckTimer);
  const btn = btn_hint();
  btn.classList.remove('hint-ready');

  if (state.every(v => v)) { btn.setAttribute('aria-disabled', 'true'); return; }

  // Once the user has used any hint, keep the button permanently enabled
  if (hintsUsed > 0) {
    btn.setAttribute('aria-disabled', 'false');
    return;
  }

  // First hint: only unlock when ≤3 cells are OFF, after 20s idle
  const off = state.filter(v => !v).length;
  if (off > 0 && off <= 3) {
    btn.setAttribute('aria-disabled', 'false');
    stuckTimer = setTimeout(() => btn.classList.add('hint-ready'), STUCK_DELAY);
  } else {
    btn.setAttribute('aria-disabled', 'true');
  }
}

function requestHint() {
  if (state.every(v => v)) return;

  if (btn_hint().getAttribute('aria-disabled') === 'true') {
    showToast('Available when 3 or fewer cells remain off');
    return;
  }

  // Compute solution path once per game-state; recomputed after any move (hintPath=null)
  if (!hintPath) {
    let path;
    if (isSongMode) {
      // In song mode, try to give remaining melody notes from current position
      // Check how many melody notes match the moves played so far
      const melodyPath = _activeSong.melody.map(n => n.cell);
      let matched = 0;
      for (let i = 0; i < Math.min(moveHistory.length, melodyPath.length); i++) {
        if (moveHistory[i].cellIndex === melodyPath[i]) matched++;
        else break;
      }
      if (matched === moveHistory.length) {
        // Player is on the melody path — give remaining notes
        path = melodyPath.slice(matched);
      } else {
        // Player deviated — fall back to BFS solver
        path = bidirBFSSolve(state) || greedyHint(state);
      }
    } else {
      path = bidirBFSSolve(state) || greedyHint(state);
    }
    if (!path || path.length === 0) {
      showToast('No hint found — try a different move');
      return;
    }
    hintPath = path;
    hintStep = 0;
  }

  if (hintStep >= hintPath.length) {
    showToast('Follow the highlighted steps!');
    return;
  }

  clearHintHighlight();
  activeHintCell = hintPath[hintStep];
  cells[activeHintCell].classList.add('hint-highlight');
  cells[activeHintCell].focus();
  previewCells(activeHintCell);
  hintsUsed++;
  hintStep++;

  btn_hint().classList.remove('hint-ready');
  // Keep button enabled — user can advance through all steps
  updateHintInfo();
}

function updateHintInfo() {
  const el = document.getElementById('hint-info');
  if (!hintPath || activeHintCell === -1) {
    el.classList.remove('visible');
    return;
  }
  const total = hintPath.length;
  const step  = hintStep; // already incremented
  el.innerHTML = `Solvable in <strong>${total}</strong> move${total === 1 ? '' : 's'} &nbsp;·&nbsp; step ${step} / ${total}`;
  el.classList.add('visible');
}

function btn_hint() { return document.getElementById('btn-hint'); }

// Hint button uses aria-disabled instead of native disabled so clicks always fire
document.getElementById('btn-hint').addEventListener('click', () => requestHint());

// ── Rendering ────────────────────────────────────────────────

let _lastHoverSound = 0; // timestamp throttle for hover sounds

function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  cells = [];

  for (let i = 0; i < SIZE * SIZE; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell cell-entering' + (state[i] ? ' on' : '');
    cell.setAttribute('role', 'gridcell');
    cell.setAttribute('tabindex', '0');
    cell.setAttribute('aria-pressed', state[i] ? 'true' : 'false');
    cell.style.setProperty('--idx', i);
    cell.addEventListener('animationend', () => cell.classList.remove('cell-entering'), { once: true });

    // Assign unique color per cell — rainbow gradient inspired by logo
    const row = Math.floor(i / SIZE);
    const col = i % SIZE;
    // Hue sweeps from cyan (180°) through blue, purple, pink, red, orange, yellow, green
    const hue = (180 + (col * 40) + (row * 50)) % 360;
    cell.style.setProperty('--hue', hue);
    cell.style.setProperty('--sat', '75%');
    cell.style.setProperty('--light', '58%');

    if (!isTouchDevice()) {
      cell.addEventListener('mouseenter', () => {
        previewCells(i);
        const now = Date.now();
        if (now - _lastHoverSound > 80) {
          _lastHoverSound = now;
          playHoverSound(i, state[i]);
        }
      });
      cell.addEventListener('mouseleave', clearPreview);
    } else {
      cell.addEventListener('touchstart', (e) => {
        _unlockAudio();
        _lpIsActive = false;
        _lpCurrentCell = i;
        _lpTimer = setTimeout(() => {
          _lpIsActive = true;
          _lpCurrentCell = i;
          previewCells(i);
          playHoverSound(i, state[i]);
        }, 300);
      }, { passive: true });

      cell.addEventListener('touchend', () => {
        _endLongPress(cell);
      }, { passive: true });

      cell.addEventListener('touchmove', (e) => {
        if (!_lpIsActive) {
          // Not yet in long-press mode — cancel the timer if finger moves
          clearTimeout(_lpTimer);
          return;
        }
        e.preventDefault(); // prevent scrolling while dragging preview
        // Find which cell is under the finger
        const touch = e.touches[0];
        const el = document.elementFromPoint(touch.clientX, touch.clientY);
        if (!el) return;
        const cellEl = el.closest('.cell');
        if (!cellEl) return;
        const idx = cells.indexOf(cellEl);
        if (idx === -1 || idx === _lpCurrentCell) return;
        _lpCurrentCell = idx;
        previewCells(idx);
        const now = Date.now();
        if (now - _lastHoverSound > 80) {
          _lastHoverSound = now;
          playHoverSound(idx, state[idx]);
        }
      }, { passive: false });

      cell.addEventListener('touchcancel', () => {
        _endLongPress(cell);
      }, { passive: true });
    }
    cell.addEventListener('click', (e) => {
      // Suppress click after a long-press preview
      if (cell._suppressClick) { cell._suppressClick = false; return; }
      handleClick(i, cell);
    });
    cell.addEventListener('keydown', e => handleKey(e, i));

    grid.appendChild(cell);
    cells.push(cell);
  }
}

function syncCells() {
  cells.forEach((cell, i) => {
    cell.classList.toggle('on', !!state[i]);
    cell.setAttribute('aria-pressed', state[i] ? 'true' : 'false');
  });
  document.getElementById('moves-val').textContent = moves;
}

function previewCells(i) {
  clearPreview();
  affectedCells(i).forEach(j => cells[j].classList.add('preview'));
}

function clearPreview() {
  cells.forEach(c => c.classList.remove('preview'));
}

// ── Interaction ──────────────────────────────────────────────

const isTouchDevice = () => window.matchMedia('(pointer: coarse)').matches;
let _mobilePreviewTimer = null;

// Long-press state (module-level so touchmove across cells works)
let _lpTimer = null;
let _lpIsActive = false;
let _lpCurrentCell = -1;

function _endLongPress(originCell) {
  clearTimeout(_lpTimer);
  if (_lpIsActive) {
    clearPreview();
    // Suppress click on the originating cell (where touchstart fired)
    if (originCell) originCell._suppressClick = true;
    _lpIsActive = false;
    _lpCurrentCell = -1;
  }
}

function handleClick(i, cell) {
  const wasHintCell = activeHintCell === i; // capture before clearHintHighlight
  clearHintHighlight();
  hintPath = null;
  hintStep = 0;
  updateHintInfo();

  const changedCells = affectedCells(i);
  const cellWasOn = state[i];

  clickCounts[i]++;
  applyToggle(i);
  moves++;
  moveHistory.push({ cellIndex: i, cellWasOn, isHint: wasHintCell });

  if (wasHintCell) {
    playMusicalClick(i, cellWasOn);
  } else {
    playGlassClick(i, cellWasOn);
  }

  // Subtle haptic feedback on mobile
  hapticImpact();

  const ripple = document.createElement('div');
  ripple.className = 'ripple';
  cell.appendChild(ripple);
  ripple.addEventListener('animationend', () => ripple.remove(), { once: true });

  clearPreview();
  if (_mobilePreviewTimer) { clearTimeout(_mobilePreviewTimer); _mobilePreviewTimer = null; }
  syncCells();
  checkStuck();

  if (isTouchDevice()) {
    // Flash the cells that actually changed, then auto-clear
    changedCells.forEach(j => cells[j].classList.add('preview'));
    _mobilePreviewTimer = setTimeout(() => { clearPreview(); _mobilePreviewTimer = null; }, 700);
  } else {
    previewCells(i);
  }

  checkWin();
}

function handleKey(e, i) {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    handleClick(i, cells[i]);
    return;
  }
  const x = i % SIZE, y = Math.floor(i / SIZE);
  let next = -1;
  if (e.key === 'ArrowRight' && x < SIZE - 1) next = i + 1;
  if (e.key === 'ArrowLeft'  && x > 0)        next = i - 1;
  if (e.key === 'ArrowDown'  && y < SIZE - 1) next = i + SIZE;
  if (e.key === 'ArrowUp'    && y > 0)        next = i - SIZE;
  if (next >= 0) {
    e.preventDefault();
    cells[next].focus();
    previewCells(next);
    playHoverSound(next, state[next]);
  }
}

// ── Global keyboard shortcuts ─────────────────────────────────
document.addEventListener('keydown', e => {
  // Ignore when win overlay is visible or an input is focused
  if (document.getElementById('win-overlay').classList.contains('visible')) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  if (e.key === 'h' || e.key === 'H') {
    e.preventDefault();
    requestHint();
    return;
  }

  if (e.key === 'Enter' && activeHintCell >= 0) {
    e.preventDefault();
    handleClick(activeHintCell, cells[activeHintCell]);
    return;
  }

  // Arrow keys: move focus between cells (start from cell 12 if none focused)
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
    const active = document.activeElement;
    const idx = cells.indexOf(active);
    if (idx === -1) {
      e.preventDefault();
      cells[12].focus();
      previewCells(12);
      playHoverSound(12, state[12]);
    }
  }
});

// ── Puzzle generation ─────────────────────────────────────────
// Start from all-ON and shuffle — guarantees solvability.

function generatePuzzleForKey(key) {
  const rng = mulberry32(seedFromKey(key));
  state = Array(SIZE * SIZE).fill(true);
  for (let k = 0; k < 10; k++) {
    applyToggle(Math.floor(rng() * SIZE * SIZE));
  }
  puzzleState = state.slice();
}

// ── Haptic feedback ───────────────────────────────────────────

// iOS Safari 17.4+: toggling <input type="checkbox" switch=""> fires native haptics
// Android: uses navigator.vibrate()
let _hapticLabel = null;

function _ensureHapticDOM() {
  if (_hapticLabel) return;
  const id = 'gg-haptic-switch';
  const label = document.createElement('label');
  label.setAttribute('for', id);
  label.style.position = 'fixed';
  label.style.opacity = '0';
  label.style.pointerEvents = 'none';
  label.style.zIndex = '-1';

  const checkbox = document.createElement('input');
  checkbox.type = 'checkbox';
  checkbox.setAttribute('switch', '');
  checkbox.id = id;
  checkbox.style.display = 'none';

  label.appendChild(checkbox);
  document.body.appendChild(label);
  _hapticLabel = label;
}

function hapticImpact() {
  if (navigator.vibrate) {
    navigator.vibrate(8);
    return;
  }
  // iOS Safari fallback — must be called within a user gesture
  _ensureHapticDOM();
  if (_hapticLabel) _hapticLabel.click();
}

// ── Audio ─────────────────────────────────────────────────────

let _audioCtx = null;
let _audioUnlocked = false;
let soundEnabled = localStorage.getItem('gg_sound') !== 'off';
let _masterGain = null;       // all sounds route through this
let _recordingDest = null;    // MediaStreamDestination for video recording

// Tiny silent MP3 as data URI (< 100 bytes). Playing an <audio> element
// switches iOS from "ambient" to "playback" audio session, which makes
// AudioContext work even when the iPhone mute/ringer switch is on.
const _silentAudio = new Audio('data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAABhgC7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7//////////////////////////////////////////////////////////////////8AAAAATGF2YzU4LjEzAAAAAAAAAAAAAAAAJAAAAAAAAAABhkVHlZcAAAAAAAAAAAAAAAAA//tQZAAP8AAAaQAAAAgAAA0gAAABAAABpAAAACAAADSAAAAETEFNRTMuMTAwVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//tQZB8P8AAAaQAAAAgAAA0gAAABAAABpAAAACAAADSAAAAEVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVQ==');
_silentAudio.setAttribute('playsinline', '');

function _getCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
  if (!_masterGain) {
    _masterGain = _audioCtx.createGain();
    _masterGain.connect(_audioCtx.destination);
  }
  return _audioCtx;
}

// Returns the node sounds should connect to (master gain → speakers + recording)
function _audioDest() {
  return _masterGain || _getCtx() && _masterGain;
}

// Connect master gain to a MediaStreamDestination for video recording
function _startAudioCapture() {
  const ctx = _getCtx();
  if (ctx.createMediaStreamDestination) {
    _recordingDest = ctx.createMediaStreamDestination();
    _masterGain.connect(_recordingDest);
    return _recordingDest.stream;
  }
  return null;
}

function _stopAudioCapture() {
  if (_recordingDest) {
    try { _masterGain.disconnect(_recordingDest); } catch (e) {}
    _recordingDest = null;
  }
}

// Called on every user gesture to unlock iOS audio.
// 1) Plays silent <audio> to switch audio session to "playback"
// 2) Creates & resumes AudioContext
// 3) Plays silent buffer through AudioContext
function _unlockAudio() {
  try {
    // Silent <audio> play — switches iOS audio session category
    if (!_audioUnlocked) {
      _silentAudio.play().then(() => { _audioUnlocked = true; }).catch(() => {});
    }
    const ctx = _getCtx();
    const buf = ctx.createBuffer(1, 1, ctx.sampleRate);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(0);
  } catch (_) {}
}
document.addEventListener('touchstart', _unlockAudio, { passive: true });
document.addEventListener('touchend',   _unlockAudio, { passive: true });
document.addEventListener('click',      _unlockAudio, { passive: true });

function initSoundUI() {
  const btn = document.getElementById('sound-toggle');
  btn.innerHTML = soundEnabled
    ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zm3.5 0c0-3.07-1.64-5.64-4-7.09v2.09c1.48 1.14 2.5 2.93 2.5 5s-1.02 3.86-2.5 5v2.09c2.36-1.45 4-4.02 4-7.09z"/></svg>'
    : '<svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z" opacity="0"/><line x1="18" y1="9" x2="22" y2="15" stroke="white" stroke-width="2"/><line x1="22" y1="9" x2="18" y2="15" stroke="white" stroke-width="2"/></svg>';
  btn.classList.toggle('sound-on', soundEnabled);
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  localStorage.setItem('gg_sound', soundEnabled ? 'on' : 'off');
  initSoundUI();
}

// C major pentatonic base frequencies (C D E G A)
const PENTA_BASE = [261.63, 293.66, 329.63, 392.00, 440.00];
const ROW_MULT   = [0.5, 0.75, 1.0, 1.5, 2.0];

function cellFreq(i) {
  return PENTA_BASE[i % SIZE] * ROW_MULT[Math.floor(i / SIZE)];
}

// Glass ding — used for regular cell clicks
function playGlassClick(cellIndex, cellWasOn) {
  if (!soundEnabled) return;
  try {
    const ctx       = _getCtx();
    const now       = ctx.currentTime;
    const freq      = cellFreq(cellIndex);
    // In song mode, use consistent pitch regardless of ON/OFF state
    const glassFreq = isSongMode ? freq * 2.0 : (cellWasOn ? freq * 1.8 : freq * 2.2);
    const decay     = isSongMode ? 1.0 : (cellWasOn ? 0.8 : 1.2);

    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(_audioDest());
    osc.type = 'sine';
    osc.frequency.setValueAtTime(glassFreq, now);
    gain.gain.setValueAtTime(isSongMode ? 0.09 : (cellWasOn ? 0.07 : 0.09), now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + decay);
    osc.start(now); osc.stop(now + decay + 0.1);

    const osc2  = ctx.createOscillator();
    const gain2 = ctx.createGain();
    osc2.connect(gain2); gain2.connect(_audioDest());
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(glassFreq * 2.756, now);
    gain2.gain.setValueAtTime(isSongMode ? 0.03 : (cellWasOn ? 0.02 : 0.03), now);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + decay * 0.5);
    osc2.start(now); osc2.stop(now + decay * 0.5 + 0.1);
  } catch (_) {}
}

// Musical pentatonic note — used for hint-guided clicks
function playMusicalClick(cellIndex, cellWasOn) {
  if (!soundEnabled) return;
  try {
    const ctx  = _getCtx();
    const now  = ctx.currentTime;
    const freq = cellFreq(cellIndex);
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(_audioDest());
    osc.type = isSongMode ? 'sine' : (cellWasOn ? 'sine' : 'triangle');
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.exponentialRampToValueAtTime(freq * (isSongMode ? 1.0 : 0.92), now + 0.12);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.14, now + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.001, now + (isSongMode ? 0.25 : (cellWasOn ? 0.18 : 0.28)));
    osc.start(now); osc.stop(now + 0.35);
  } catch (_) {}
}

// Subtle short pop — used for hover
function playHoverSound(cellIndex, cellIsOn) {
  if (!soundEnabled) return;
  try {
    const ctx  = _getCtx();
    const now  = ctx.currentTime;
    const freq = cellFreq(cellIndex);
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(_audioDest());
    osc.type = 'sine';
    osc.frequency.setValueAtTime(cellIsOn ? freq * 0.88 : freq * 1.12, now);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(cellIsOn ? 0.04 : 0.05, now + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
    osc.start(now); osc.stop(now + 0.06);
  } catch (_) {}
}

// ── Interactive Replay ─────────────────────────────────────────

let _replayStates  = [];   // precomputed grid states [initial, afterMove1, ...]
let _replayStep    = 0;    // current step (0 = initial, N = after N moves)
let _replayTimer   = null;
let _replayPlaying = false;
let _autoplayTimer = null;
let _winViewMode   = 'replay'; // 'replay' or 'heatmap'

const REPLAY_INTERVAL = 160;

// Pure state computation — does not touch globals
function applyToggleToState(st, cellIndex) {
  const next = st.slice();
  const affected = st[cellIndex] ? plusPattern(cellIndex) : crossPattern(cellIndex);
  affected.forEach(j => { next[j] = !next[j]; });
  return next;
}

function buildReplayStates() {
  _replayStates = [puzzleState.slice()];
  for (const move of moveHistory) {
    _replayStates.push(applyToggleToState(_replayStates.at(-1), move.cellIndex));
  }
}

function resetReplayState() {
  if (_replayTimer) { clearTimeout(_replayTimer); _replayTimer = null; }
  if (_autoplayTimer) { clearTimeout(_autoplayTimer); _autoplayTimer = null; }
  _replayStep    = 0;
  _replayPlaying = false;
  _replayStates  = [];
}

function renderReplayGrid(step) {
  const winGrid = document.getElementById('win-grid');
  const st = _replayStates[step];
  const clickedCell = step > 0 ? moveHistory[step - 1].cellIndex : -1;
  const gridCells = winGrid.querySelectorAll('.win-grid-cell');

  gridCells.forEach((c, i) => {
    c.classList.toggle('cell-on', !!st[i]);
    c.classList.toggle('cell-off', !st[i]);
    c.classList.toggle('cell-clicked', i === clickedCell);
    c.textContent = '';
    c.style.background = '';
    c.style.boxShadow = '';
  });
}

function updateReplayUI() {
  const total = moveHistory.length;
  const fill = document.getElementById('replay-track-fill');
  const btn = document.getElementById('replay-play-btn');

  fill.style.width = total > 0 ? `${(_replayStep / total) * 100}%` : '0%';
  btn.innerHTML = _replayPlaying
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="white"><rect x="5" y="3" width="5" height="18" rx="1"/><rect x="14" y="3" width="5" height="18" rx="1"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="white"><polygon points="6,3 20,12 6,21"/></svg>';
}

function renderReplayStep(step) {
  _replayStep = step;
  renderCurrentView(step);
  updateReplayUI();
}

function scheduleNextReplayStep() {
  if (!_replayPlaying) return;
  if (_replayStep >= moveHistory.length) {
    _replayPlaying = false;
    updateReplayUI();
    stopLiveRecording();
    return;
  }

  // In song mode, use beat-based intervals from the melody data
  let interval = REPLAY_INTERVAL;
  if (isSongMode && _activeSong) {
    const noteIdx = _replayStep; // next note to play
    if (noteIdx < _activeSong.melody.length) {
      const beats = _activeSong.melody[noteIdx].beats;
      interval = (beats * 60 / _activeSong.bpm) * 1000;
    }
  }

  _replayTimer = setTimeout(() => {
    _replayStep++;
    renderCurrentView(_replayStep);
    updateReplayUI();
    updateLiveRecording(_replayStep);

    // Play sound for this move
    if (soundEnabled && _replayStep > 0) {
      const move = moveHistory[_replayStep - 1];
      if (move.isHint) {
        playMusicalClick(move.cellIndex, move.cellWasOn);
      } else {
        playGlassClick(move.cellIndex, move.cellWasOn);
      }
    }

    scheduleNextReplayStep();
  }, interval);
}

function toggleReplayPlayback() {
  if (_replayPlaying) {
    // Pause
    _replayPlaying = false;
    if (_replayTimer) { clearTimeout(_replayTimer); _replayTimer = null; }
    updateReplayUI();
  } else {
    // Play / Resume
    if (_replayStep >= moveHistory.length) {
      _replayStep = 0;
      renderCurrentView(0);
    }
    _replayPlaying = true;
    updateReplayUI();
    scheduleNextReplayStep();
  }
}

function seekToPosition(clientX) {
  const track = document.getElementById('replay-track');
  const rect = track.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  const step = Math.round(pct * moveHistory.length);
  if (step === _replayStep) return;

  // Play sound for the step we're landing on
  if (soundEnabled && step > 0) {
    const move = moveHistory[step - 1];
    if (move.isHint) {
      playMusicalClick(move.cellIndex, move.cellWasOn);
    } else {
      playGlassClick(move.cellIndex, move.cellWasOn);
    }
  }

  renderReplayStep(step);
}

let _wasDragging = false;
let _wasPlayingBeforeDrag = false;

function startDrag(clientX) {
  _wasDragging = true;
  _wasPlayingBeforeDrag = _replayPlaying;
  if (_replayPlaying) {
    _replayPlaying = false;
    if (_replayTimer) { clearTimeout(_replayTimer); _replayTimer = null; }
  }
  seekToPosition(clientX);
}

function duringDrag(clientX) {
  if (!_wasDragging) return;
  seekToPosition(clientX);
}

function endDrag() {
  if (!_wasDragging) return;
  _wasDragging = false;
  if (_wasPlayingBeforeDrag && _replayStep < moveHistory.length) {
    _replayPlaying = true;
    updateReplayUI();
    scheduleNextReplayStep();
  }
}

// Mouse drag
document.addEventListener('mousemove', (e) => duringDrag(e.clientX));
document.addEventListener('mouseup', () => endDrag());

// Touch drag
document.addEventListener('touchmove', (e) => {
  if (_wasDragging) {
    e.preventDefault();
    duringDrag(e.touches[0].clientX);
  }
}, { passive: false });
document.addEventListener('touchend', () => endDrag());
document.addEventListener('touchcancel', () => endDrag());

function seekReplay(e) {
  // Click-to-seek (non-drag)
  startDrag(e.clientX || (e.touches && e.touches[0].clientX));
  _wasPlayingBeforeDrag = false; // don't auto-resume on click
  _wasDragging = false;
}

function switchWinView(mode) {
  if (mode === _winViewMode) return;
  _winViewMode = mode;

  // Update tabs
  document.querySelectorAll('.win-view-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.view === mode);
  });

  const winGrid = document.getElementById('win-grid');

  if (mode === 'replay') {
    winGrid.classList.add('replay-mode');
    renderReplayStep(_replayStep);
  } else {
    winGrid.classList.remove('replay-mode');
    renderHeatmapAtStep(_replayStep);
    updateReplayUI();
  }
}

function startAutoplay() {
  if (!document.getElementById('win-overlay').classList.contains('visible')) return;
  if (_replayPlaying) return;
  _replayStep = 0;
  renderCurrentView(0);
  _replayPlaying = true;
  updateReplayUI();
  startLiveRecording();
  scheduleNextReplayStep();
}

function playWin() {
  if (!soundEnabled) return;
  try {
    const ctx = _getCtx();
    const now = ctx.currentTime;
    [261.63, 329.63, 392.00, 523.25, 659.25, 783.99].forEach((freq, i) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(_audioDest());
      osc.type = 'sine';
      const t = now + i * 0.11;
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.18, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
      osc.start(t); osc.stop(t + 0.8);
    });
  } catch (_) {}
}

let isReplayMode = false; // true when viewing a shared replay URL

function renderHeatmapAtStep(step) {
  const winGrid = document.getElementById('win-grid');
  // Count clicks up to this step
  const counts = new Array(SIZE * SIZE).fill(0);
  for (let i = 0; i < step; i++) {
    counts[moveHistory[i].cellIndex]++;
  }
  const maxCount = Math.max(1, ...counts);
  const gridCells = winGrid.querySelectorAll('.win-grid-cell');
  gridCells.forEach((c, i) => {
    const n = counts[i];
    c.className = 'win-grid-cell';
    if (n === 0) {
      c.style.background = 'rgba(255,255,255,0.04)';
      c.style.boxShadow = 'none';
      c.style.borderColor = '';
    } else {
      const row = Math.floor(i / SIZE), col = i % SIZE;
      const hue = (180 + col * 40 + row * 50) % 360;
      const intensity = 0.3 + 0.7 * (n / maxCount);
      c.style.background = `hsl(${hue}, 75%, ${58 + (1 - intensity) * 15}%)`;
      c.style.boxShadow = `0 0 ${6 + intensity * 8}px hsla(${hue}, 75%, 58%, ${intensity * 0.6})`;
      c.style.borderColor = `hsla(${hue}, 75%, 70%, ${intensity * 0.5})`;
    }
    c.textContent = n > 0 ? n : '';
  });
}

function renderCurrentView(step) {
  if (_winViewMode === 'replay') {
    renderReplayGrid(step);
  } else {
    renderHeatmapAtStep(step);

}

function checkWin() {
  if (!state.every(v => v)) return;

  resetHintState();
  btn_hint().setAttribute('aria-disabled', 'true');

  if (isSongMode) {
    // No streak update in song mode
    showWinOverlay({ streakUpdated: false });
  } else {
    const streakUpdated = tryUpdateStreak();
    refreshStreakDisplay();

    // Push win state to browser history so back button can restore it
    const puzzleNum = puzzleNumberFromKey(currentDateKey);
    const replayEncoded = encodeMoves(moveHistory);
    const winUrl = `${location.pathname}?p=${puzzleNum}&r=${replayEncoded}&own=1`;
    history.pushState({ win: true }, '', winUrl);

    showWinOverlay({ streakUpdated });
  }
  playWin();
  spawnParticles();

// ── Share ─────────────────────────────────────────────────────

function encodeMoves(history) {
  // Uppercase A–Y = regular click; lowercase a–y = hint-guided click
  return history.map(({ cellIndex, isHint }) => {
    const base = isHint ? 97 : 65; // 'a' vs 'A'
    return String.fromCharCode(base + cellIndex);
  }).join('');
}

// ── Canvas replay rendering & video export ────────────────────

function _canvasRoundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawReplayFrame(ctx, W, H, step, clickedCell) {
  const cellSize = 80, gap = 8;
  const gridW = SIZE * cellSize + (SIZE - 1) * gap;
  const gridX = (W - gridW) / 2;
  const gridY = (H - gridW) / 2 + 20;

  // Background
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, W, H);

  // Title
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 26px system-ui, -apple-system, sans-serif';
  ctx.textAlign = 'center';
  const replayTitle = isSongMode ? `♪ ${_activeSong.title}` : `GlowGrid #${puzzleNumberFromKey(currentDateKey)}`;
  ctx.fillText(replayTitle, W / 2, 46);

  // Grid
  const st = _replayStates[step];
  for (let i = 0; i < SIZE * SIZE; i++) {
    const row = Math.floor(i / SIZE), col = i % SIZE;
    const x = gridX + col * (cellSize + gap);
    const y = gridY + row * (cellSize + gap);
    const hue = (180 + col * 40 + row * 50) % 360;

    _canvasRoundRect(ctx, x, y, cellSize, cellSize, 12);

    if (st[i]) {
      const grad = ctx.createRadialGradient(
        x + cellSize / 2, y + cellSize / 2, 0,
        x + cellSize / 2, y + cellSize / 2, cellSize * 0.7
      );
      grad.addColorStop(0, `hsl(${hue}, 75%, 68%)`);
      grad.addColorStop(1, `hsl(${hue}, 75%, 48%)`);
      ctx.fillStyle = grad;
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
    }
    ctx.fill();

    ctx.strokeStyle = i === clickedCell
      ? `hsl(${hue}, 85%, 72%)`
      : 'rgba(255,255,255,0.06)';
    ctx.lineWidth = i === clickedCell ? 3 : 1;
    ctx.stroke();
  }
}

let _isRecordingShare = false;
let _preparedShareFile = null;
let _liveRecorder = null;
let _liveRecordCanvas = null;
let _liveRecordCtx = null;
let _liveRecordVTrack = null;
let _liveRecordChunks = [];

// Start live recording of the replay (called when autoplay begins)
function startLiveRecording() {
  _preparedShareFile = null;
  _liveRecordChunks = [];

  // Always prepare a static image as fallback
  generateReplayImage().then(blob => {
    if (blob && !_preparedShareFile) {
      _preparedShareFile = new File([blob], 'glowgrid.png', { type: 'image/png' });
    }
  }).catch(() => {});

  try {
    const canvas = document.createElement('canvas');
    const W = 540, H = 540;
    canvas.width = W; canvas.height = H;
    _liveRecordCanvas = canvas;
    _liveRecordCtx = canvas.getContext('2d');

    if (!canvas.captureStream || !window.MediaRecorder) return;

    const stream = canvas.captureStream(0);
    _liveRecordVTrack = stream.getVideoTracks()[0];

    // Capture audio
    const audioStream = _startAudioCapture();
    const combined = new MediaStream([...stream.getVideoTracks()]);
    if (audioStream) {
      audioStream.getAudioTracks().forEach(t => combined.addTrack(t));
    }

    // Prefer MP4 (universal playback) over WebM
    const codecs = [
      'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
      'video/mp4;codecs=avc1.42E01E',
      'video/mp4',
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm',
    ];
    const mimeType = codecs.find(t => MediaRecorder.isTypeSupported(t));
    _liveRecorder = mimeType
      ? new MediaRecorder(combined, { mimeType })
      : new MediaRecorder(combined);

    _liveRecorder.ondataavailable = e => { if (e.data.size) _liveRecordChunks.push(e.data); };
    _liveRecorder.onstop = () => {
      _stopAudioCapture();
      combined.getTracks().forEach(t => t.stop());
      const blob = new Blob(_liveRecordChunks, { type: _liveRecorder.mimeType || 'video/webm' });
      if (blob.size > 0) {
        const ext = (blob.type || '').includes('mp4') ? 'mp4' : 'webm';
        const pNum = puzzleNumberFromKey(currentDateKey);
        _preparedShareFile = new File([blob], `glowgrid-replay-${pNum}.${ext}`, { type: blob.type });
      }
      _liveRecorder = null;
    };
    _liveRecorder.onerror = () => { _stopAudioCapture(); _liveRecorder = null; };

    // Draw initial frame
    drawReplayFrame(_liveRecordCtx, W, H, 0, -1);
    if (_liveRecordVTrack.requestFrame) _liveRecordVTrack.requestFrame();
    _liveRecorder.start();
  } catch (e) {
    _liveRecorder = null;
  }
}

// Called on each replay step to update the recording canvas
function updateLiveRecording(step) {
  if (!_liveRecordCtx || !_liveRecorder) return;
  const clickedCell = step > 0 ? moveHistory[step - 1].cellIndex : -1;
  drawReplayFrame(_liveRecordCtx, 540, 540, step, clickedCell);
  if (_liveRecordVTrack && _liveRecordVTrack.requestFrame) _liveRecordVTrack.requestFrame();
}

// Called when replay finishes or is stopped
function stopLiveRecording() {
  if (_liveRecorder && _liveRecorder.state === 'recording') {
    // Hold final frame briefly then stop
    setTimeout(() => {
      if (_liveRecorder && _liveRecorder.state === 'recording') {
        _liveRecorder.stop();
      }
    }, 600);
  }
}

function buildShareText() {
  if (isSongMode) {
    const rows = [];
    const hueToEmoji = (hue) => {
      if (hue >= 330 || hue < 15)  return '🟥';
      if (hue < 45)  return '🟧';
      if (hue < 75)  return '🟨';
      if (hue < 165) return '🟩';
      if (hue < 255) return '🟦';
      return '🟪';
    };
    for (let r = 0; r < SIZE; r++) {
      let row = '';
      for (let c = 0; c < SIZE; c++) {
        if (clickCounts[r * SIZE + c] === 0) row += '⬛';
        else {
          const hue = (180 + c * 40 + r * 50) % 360;
          row += hueToEmoji(hue);
        }
      }
      rows.push(row);
    }
    const hintSuffix = hintsUsed > 0 ? ` (${hintsUsed} hint${hintsUsed > 1 ? 's' : ''})` : '';
    const songURL = `${location.origin}${location.pathname}?song=${_songParam}`;
    return [
      `♪ GlowGrid Song Challenge: ${_activeSong.title} ✨`,
      ...rows,
      `Solved in ${moves} move${moves === 1 ? '' : 's'}${hintSuffix}`,
      `Can you play the melody?`,
      '',
      songURL,
    ].join('\n');
  }

  const num = puzzleNumberFromKey(currentDateKey);
  const dateStr = dateFromKey(currentDateKey).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const rows = [];
  // Map cell hues to colored square emojis
  const hueToEmoji = (hue) => {
    if (hue >= 330 || hue < 15)  return '🟥'; // red
    if (hue < 45)  return '🟧'; // orange
    if (hue < 75)  return '🟨'; // yellow
    if (hue < 165) return '🟩'; // green
    if (hue < 255) return '🟦'; // blue
    return '🟪'; // purple/pink
  };
  for (let r = 0; r < SIZE; r++) {
    let row = '';
    for (let c = 0; c < SIZE; c++) {
      if (clickCounts[r * SIZE + c] === 0) {
        row += '⬛';
      } else {
        const hue = (180 + c * 40 + r * 50) % 360;
        row += hueToEmoji(hue);
      }
    }
    rows.push(row);
  }
  const streak = getStreak();
  const streakSuffix = currentDateKey === todayKey() && streak > 1 ? ` 🔥${streak}` : '';
  const hintSuffix = hintsUsed > 0 ? ` (${hintsUsed} hint${hintsUsed > 1 ? 's' : ''})` : '';
  const replayEncoded = encodeMoves(moveHistory);
  const puzzleNum = puzzleNumberFromKey(currentDateKey);
  const replayURL = `${location.origin}${location.pathname}?p=${puzzleNum}&r=${replayEncoded}`;
  return [
    `Here is my result for GlowGrid #${num} · ${dateStr} ✨`,
    ...rows,
    `Solved in ${moves} move${moves === 1 ? '' : 's'}${hintSuffix}${streakSuffix}`,
    `Can you do better?`,
    '',
    `🎵 Hear my solution:`,
    replayURL,
  ].join('\n');
}

async function generateReplayImage() {
  const canvas = document.createElement('canvas');
  const W = 540, H = 540;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  drawHeatmapFrame(ctx, W, H);
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

function drawHeatmapFrame(ctx, W, H) {
  const cellSize = 80, gap = 8;
  const gridW = SIZE * cellSize + (SIZE - 1) * gap;
  const gridX = (W - gridW) / 2;
  const gridY = (H - gridW) / 2 + 20;

  // Background
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, W, H);

  // Title
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 26px system-ui, -apple-system, sans-serif';
  ctx.textAlign = 'center';
  const heatmapTitle = isSongMode ? `♪ ${_activeSong.title}` : `GlowGrid #${puzzleNumberFromKey(currentDateKey)}`;
  ctx.fillText(heatmapTitle, W / 2, 46);

  const maxCount = Math.max(1, ...clickCounts);

  for (let i = 0; i < SIZE * SIZE; i++) {
    const row = Math.floor(i / SIZE), col = i % SIZE;
    const x = gridX + col * (cellSize + gap);
    const y = gridY + row * (cellSize + gap);
    const hue = (180 + col * 40 + row * 50) % 360;
    const n = clickCounts[i];

    _canvasRoundRect(ctx, x, y, cellSize, cellSize, 12);

    if (n > 0) {
      const intensity = 0.3 + 0.7 * (n / maxCount);
      const light = 58 + (1 - intensity) * 15;
      ctx.fillStyle = `hsl(${hue}, 75%, ${light}%)`;
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
    }
    ctx.fill();

    ctx.strokeStyle = n > 0 ? `hsla(${hue}, 75%, 70%, 0.5)` : 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    ctx.stroke();

    if (n > 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = 'bold 24px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(n, x + cellSize / 2, y + cellSize / 2);
    }
  }
}

async function shareResult() {
  const text = buildShareText();

  try {
    if (navigator.share) {
      const shareData = { text };

      // Attach pre-recorded file if the platform supports sharing it
      if (_preparedShareFile && navigator.canShare && navigator.canShare({ files: [_preparedShareFile] })) {
        shareData.files = [_preparedShareFile];
      }

      await navigator.share(shareData);
      return;
    }

    // Fallback: clipboard
    await navigator.clipboard.writeText(text);
    showToast('Copied to clipboard!');
  } catch (e) {
    if (e.name !== 'AbortError') {
      navigator.clipboard.writeText(text)
        .then(() => showToast('Copied to clipboard!'))
        .catch(() => showToast('Copy failed — try again'));
    }
  }
}

// ── Replay mode (shared URL) ──────────────────────────────────

function enterReplayMode(dateKey, encoded) {
  isReplayMode = true;
  currentDateKey = dateKey;

  // Update nav label
  const num = puzzleNumberFromKey(dateKey);
  const label = formatDateLabel(dateKey);
  document.getElementById('puzzle-label').textContent = `#${num} · ${label}`;

  const today = todayKey();
  const minDate = offsetDate(today, -MAX_DAYS_BACK);
  document.getElementById('btn-prev').disabled = compareDateKeys(currentDateKey, minDate) <= 0;
  document.getElementById('btn-next').disabled = compareDateKeys(currentDateKey, today) >= 0;

  // Generate puzzle and simulate moves to rebuild state + heatmap
  generatePuzzleForKey(dateKey);
  clickCounts = new Array(SIZE * SIZE).fill(0);
  moveHistory = [];

  const chars = encoded.split('');
  for (const ch of chars) {
    const code = ch.charCodeAt(0);
    const isHint = code >= 97; // lowercase = hint click
    const idx = code - (isHint ? 97 : 65);
    if (idx < 0 || idx >= SIZE * SIZE) continue;
    moveHistory.push({ cellIndex: idx, cellWasOn: state[idx], isHint });
    clickCounts[idx]++;
    applyToggle(idx);
  }
  moves = moveHistory.length;

  buildGrid(); // show solved (all-ON) grid behind the overlay
  refreshStreakDisplay();
  showWinOverlay({ replayMode: true });
  spawnParticles();
}

function tryYourself() {
  isReplayMode = false;
  history.replaceState({}, '', location.pathname);
  loadCurrentPuzzle();
}

function showSongSolution() {
  if (!isSongMode || !_activeSong) return;

  // Simulate playing the canonical melody from the starting state
  state = _activeSong.startState.slice();
  puzzleState = state.slice();
  clickCounts = new Array(SIZE * SIZE).fill(0);
  moveHistory = [];

  for (const note of _activeSong.melody) {
    moveHistory.push({ cellIndex: note.cell, cellWasOn: state[note.cell], isHint: false });
    clickCounts[note.cell]++;
    applyToggle(note.cell);
  }
  moves = moveHistory.length;
  hintsUsed = 0;

  buildGrid();
  showWinOverlay({ replayMode: true });
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 2200);
}

// ── Particles ────────────────────────────────────────────────

function spawnParticles() {
  const colors = ['#60a5fa', '#a78bfa', '#34d399', '#fbbf24', '#f472b6', '#38bdf8', '#fb923c', '#c084fc'];
  const w = window.innerWidth;
  const h = window.innerHeight;

  // Sparkles burst from both sides — big, screen-filling
  for (let side = 0; side < 2; side++) {
    const startX = side === 0 ? -10 : w + 10;
    const dirX = side === 0 ? 1 : -1;

    for (let i = 0; i < 40; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 6 + Math.random() * 18;
      const startY = h * (0.05 + Math.random() * 0.8);
      const tx = dirX * (100 + Math.random() * (w * 0.5));
      const ty = -120 + Math.random() * 240;
      p.style.cssText = `
        left: ${startX}px; top: ${startY}px;
        width: ${size}px; height: ${size}px;
        background: ${colors[(side * 5 + i) % colors.length]};
        --tx: ${tx.toFixed(1)}px;
        --ty: ${ty.toFixed(1)}px;
        --dur: ${(0.8 + Math.random() * 1.4).toFixed(2)}s;
        --delay: ${(Math.random() * 0.35).toFixed(2)}s;
      `;
      document.body.appendChild(p);
      p.addEventListener('animationend', () => p.remove(), { once: true });
    }
  }
}

// ── Navigation & reset ────────────────────────────────────────

function goDate(delta) {
  const candidate = offsetDate(currentDateKey, delta);
  const today = todayKey();
  const minDate = offsetDate(today, -MAX_DAYS_BACK);

  if (compareDateKeys(candidate, today) > 0) return;
  if (compareDateKeys(candidate, minDate) < 0) return;

  currentDateKey = candidate;
  loadCurrentPuzzle();
}

function resetPuzzle() {
  resetReplayState();
  document.getElementById('win-overlay').classList.remove('visible');
  state = puzzleState.slice();
  moves = 0;
  clickCounts = new Array(SIZE * SIZE).fill(0);
  moveHistory = [];
  hintsUsed = 0;
  resetHintState();
  buildGrid();
  document.getElementById('moves-val').textContent = moves;
  checkStuck();
  // Push clean URL so the win entry stays in history for back navigation
  if (isSongMode) {
    if (location.search !== `?song=${_songParam}`) {
      history.pushState({}, '', `${location.pathname}?song=${_songParam}`);
    }
  } else if (location.search) {
    history.pushState({}, '', location.pathname);
  }
}

function confirmReset() {
  if (moves === 0) { resetPuzzle(); return; }
  if (confirm('Reset the puzzle? Your progress will be lost.')) resetPuzzle();
}

function loadCurrentPuzzle() {
  generatePuzzleForKey(currentDateKey);

  const num = puzzleNumberFromKey(currentDateKey);
  const label = formatDateLabel(currentDateKey);
  document.getElementById('puzzle-label').textContent = `#${num} · ${label}`;

  const today = todayKey();
  const minDate = offsetDate(today, -MAX_DAYS_BACK);
  document.getElementById('btn-prev').disabled = compareDateKeys(currentDateKey, minDate) <= 0;
  document.getElementById('btn-next').disabled = compareDateKeys(currentDateKey, today) >= 0;

  resetPuzzle();
  refreshStreakDisplay();
}

// ── Init ─────────────────────────────────────────────────────

currentDateKey = todayKey();
initSoundUI();

if (isSongMode) {
  // Song challenge mode
  document.querySelector('.date-nav').style.display = 'none';
  // Hide streak, keep moves
  document.querySelector('.stats').querySelectorAll('.stat-divider, .stat:last-child').forEach(el => el.style.display = 'none');
  document.querySelector('.subtitle').textContent = `♪ ${_activeSong.title}`;
  document.getElementById('btn-solution').style.display = '';
  document.getElementById('song-link').style.display = 'none';

  // Load hardcoded starting state
  state = _activeSong.startState.slice();
  puzzleState = state.slice();
  moves = 0;
  clickCounts = new Array(SIZE * SIZE).fill(0);
  moveHistory = [];
  hintsUsed = 0;
  resetHintState();
  buildGrid();
  checkStuck();
} else {

const _params = new URLSearchParams(location.search);
const _replayParam = _params.get('r');
const _puzzleNum   = parseInt(_params.get('p'), 10);

if (_replayParam && _puzzleNum > 0) {
  const _replayDate = keyFromPuzzleNumber(_puzzleNum);
  const _ownMode = _params.get('own') === '1';
  if (compareDateKeys(_replayDate, todayKey()) > 0) {
    // Future puzzle — refuse and load today
    history.replaceState({}, '', location.pathname);
    loadCurrentPuzzle();
  } else if (_ownMode) {
    // Own-mode: simulate playing the game then show win screen as if you solved it
    currentDateKey = _replayDate;
    generatePuzzleForKey(_replayDate);
    clickCounts = new Array(SIZE * SIZE).fill(0);
    moveHistory = [];
    const chars = _replayParam.split('');
    for (const ch of chars) {
      const code = ch.charCodeAt(0);
      const isHint = code >= 97;
      const idx = code - (isHint ? 97 : 65);
      if (idx < 0 || idx >= SIZE * SIZE) continue;
      moveHistory.push({ cellIndex: idx, cellWasOn: state[idx], isHint });
      clickCounts[idx]++;
      applyToggle(idx);
    }
    moves = moveHistory.length;
    hintsUsed = moveHistory.filter(m => m.isHint).length;
    buildGrid();
    refreshStreakDisplay();
    if (state.every(v => v)) {
      checkWin(); // triggers the win overlay as your own game
    } else {
      // Replay doesn't solve this puzzle (tampered URL) — load normally
      history.replaceState({}, '', location.pathname);
      currentDateKey = todayKey();
      loadCurrentPuzzle();
    }
  } else {
    enterReplayMode(_replayDate, _replayParam);
  }
} else {
  loadCurrentPuzzle();
}
}

// Handle browser back/forward to restore win screen
window.addEventListener('popstate', () => {
  const params = new URLSearchParams(location.search);
  const r = params.get('r');
  const p = parseInt(params.get('p'), 10);
  const own = params.get('own') === '1';

  if (r && p > 0 && own) {
    const dateKey = keyFromPuzzleNumber(p);
    currentDateKey = dateKey;
    generatePuzzleForKey(dateKey);
    clickCounts = new Array(SIZE * SIZE).fill(0);
    moveHistory = [];
    const chars = r.split('');
    for (const ch of chars) {
      const code = ch.charCodeAt(0);
      const isHint = code >= 97;
      const idx = code - (isHint ? 97 : 65);
      if (idx < 0 || idx >= SIZE * SIZE) continue;
      moveHistory.push({ cellIndex: idx, cellWasOn: state[idx], isHint });
      clickCounts[idx]++;
      applyToggle(idx);
    }
    moves = moveHistory.length;
    hintsUsed = moveHistory.filter(m => m.isHint).length;
    buildGrid();
    refreshStreakDisplay();
    if (state.every(v => v)) {
      showWinOverlay({});
    } else {
      // Tampered URL — dismiss
      history.replaceState({}, '', location.pathname);
      currentDateKey = todayKey();
      loadCurrentPuzzle();
    }
  } else {
    // Back to game
    document.getElementById('win-overlay').classList.remove('visible');
    resetReplayState();
  }
});

// Register service worker for offline support
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
