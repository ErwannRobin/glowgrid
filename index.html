<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GlowGrid</title>

<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0a0f1e;
  color: #e2e8f0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

/* ── Animated background ── */
.bg-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(90px);
  opacity: 0.12;
  pointer-events: none;
  animation: orb-drift 22s ease-in-out infinite;
}
.bg-orb:nth-child(1) {
  width: 500px; height: 500px;
  background: #3b82f6;
  top: -150px; left: -150px;
  animation-delay: 0s;
}
.bg-orb:nth-child(2) {
  width: 350px; height: 350px;
  background: #8b5cf6;
  bottom: -80px; right: -80px;
  animation-delay: -8s;
}
.bg-orb:nth-child(3) {
  width: 250px; height: 250px;
  background: #06b6d4;
  bottom: 25%; left: 8%;
  animation-delay: -16s;
}

@keyframes orb-drift {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33%       { transform: translate(40px, -30px) scale(1.06); }
  66%       { transform: translate(-25px, 40px) scale(0.94); }
}

/* ── Layout ── */
.container {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
}

/* ── Header ── */
.title {
  font-size: 30px;
  font-weight: 700;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, #e2e8f0 30%, #64748b);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-align: center;
  line-height: 1;
}

.subtitle {
  font-size: 11px;
  color: #334155;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-top: 5px;
  text-align: center;
}

/* ── Date navigation ── */
.date-nav {
  display: flex;
  align-items: center;
  gap: 10px;
}

.nav-btn {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.07);
  background: rgba(255,255,255,0.04);
  color: #475569;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
  padding: 0;
  line-height: 1;
}

.nav-btn:hover:not(:disabled) {
  background: rgba(255,255,255,0.08);
  color: #94a3b8;
  border-color: rgba(255,255,255,0.13);
}

.nav-btn:disabled {
  opacity: 0.2;
  cursor: not-allowed;
}

.puzzle-label {
  font-size: 12px;
  color: #334155;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  text-align: center;
  min-width: 140px;
}

/* ── Stats ── */
.stats {
  display: flex;
  gap: 28px;
  align-items: center;
}

.stat { text-align: center; }

.stat-value {
  font-size: 24px;
  font-weight: 600;
  color: #e2e8f0;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.stat-label {
  font-size: 10px;
  color: #334155;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-top: 3px;
}

.stat-divider {
  width: 1px;
  height: 34px;
  background: rgba(255,255,255,0.06);
}

/* ── Grid ── */
.grid {
  display: grid;
  grid-template-columns: repeat(5, 70px);
  gap: 12px;
}

/* ── Cell ── */
.cell {
  width: 70px;
  height: 70px;
  border-radius: 20px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.07);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.04),
    0 6px 20px rgba(0,0,0,0.4);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition:
    transform 0.15s ease,
    background 0.22s ease,
    border-color 0.22s ease,
    box-shadow 0.22s ease;
  outline: none;

  animation: cell-in 0.35s ease both;
  animation-delay: calc(var(--idx) * 18ms);
}

@keyframes cell-in {
  from { opacity: 0; transform: scale(0.75); }
  to   { opacity: 1; transform: scale(1); }
}

.cell:hover {
  transform: translateY(-2px) scale(1.04);
  border-color: rgba(255,255,255,0.14);
}

.cell:active { transform: scale(0.94); }

.cell:focus-visible {
  outline: 2px solid rgba(96,165,250,0.55);
  outline-offset: 2px;
}

/* ON state */
.cell.on {
  background: radial-gradient(circle at 38% 32%, #bae6fd, #60a5fa 55%, #3b82f6);
  border-color: rgba(147,197,253,0.45);
  box-shadow:
    0 0 22px rgba(59,130,246,0.5),
    0 0 50px rgba(59,130,246,0.18),
    inset 0 1px 2px rgba(255,255,255,0.45);
}

.cell.on::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(circle at 28% 28%, rgba(255,255,255,0.35), transparent 58%);
  pointer-events: none;
}

/* Preview highlight */
.cell.preview {
  border-color: rgba(250,204,21,0.5);
  box-shadow:
    0 0 0 2px rgba(250,204,21,0.25),
    0 0 18px rgba(250,204,21,0.2),
    0 6px 20px rgba(0,0,0,0.4);
  transform: scale(1.02);
}

/* Click ripple */
.ripple {
  position: absolute;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,0.22);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0);
  animation: ripple-out 0.38s ease-out forwards;
  pointer-events: none;
}

@keyframes ripple-out {
  to { transform: translate(-50%, -50%) scale(3.2); opacity: 0; }
}

/* ── Action buttons ── */
.actions {
  display: flex;
  gap: 10px;
}

.btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 9px 16px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.05);
  color: #64748b;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.18s ease;
  backdrop-filter: blur(8px);
  letter-spacing: 0.1px;
}

.btn:hover {
  background: rgba(255,255,255,0.09);
  color: #94a3b8;
  border-color: rgba(255,255,255,0.13);
}

.btn:active { transform: scale(0.96); }

/* ── Win overlay ── */
.win-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(14px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
}

.win-overlay.visible {
  opacity: 1;
  pointer-events: all;
}

.win-card {
  background: rgba(10,15,30,0.92);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 28px;
  padding: 40px 48px;
  text-align: center;
  transform: scale(0.82) translateY(24px);
  transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow:
    0 0 70px rgba(59,130,246,0.18),
    0 28px 60px rgba(0,0,0,0.5);
}

.win-overlay.visible .win-card {
  transform: scale(1) translateY(0);
}

.win-emoji {
  font-size: 48px;
  display: block;
  margin-bottom: 12px;
  animation: emoji-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
}

@keyframes emoji-pop {
  from { transform: scale(0) rotate(-15deg); }
  to   { transform: scale(1) rotate(0deg); }
}

.win-title {
  font-size: 26px;
  font-weight: 700;
  color: #e2e8f0;
  letter-spacing: -0.3px;
  margin-bottom: 4px;
}

.win-caption {
  font-size: 13px;
  color: #334155;
  margin-bottom: 20px;
}

/* Mini grid preview in win overlay */
.win-grid {
  display: grid;
  grid-template-columns: repeat(5, 26px);
  gap: 4px;
  margin: 0 auto 8px;
  width: fit-content;
}

.win-grid-cell {
  width: 26px;
  height: 26px;
  border-radius: 6px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: rgba(255,255,255,0.55);
  transition: background 0.15s ease;
}

.win-moves-line {
  font-size: 13px;
  color: #475569;
  margin-bottom: 22px;
  font-variant-numeric: tabular-nums;
}

/* Streak badge in win overlay */
.win-streak {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 600;
  color: #fb923c;
  background: rgba(251,146,60,0.08);
  border: 1px solid rgba(251,146,60,0.18);
  border-radius: 8px;
  padding: 4px 12px;
  margin-bottom: 22px;
  letter-spacing: 0.2px;
}

.win-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.btn-share {
  padding: 12px 22px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.06);
  color: #94a3b8;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s ease;
  letter-spacing: 0.1px;
}

.btn-share:hover {
  background: rgba(255,255,255,0.1);
  color: #e2e8f0;
}

.btn-share:active { transform: scale(0.96); }

.btn-play-again {
  background: linear-gradient(135deg, #3b82f6, #6366f1);
  color: white;
  border: none;
  padding: 12px 28px;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 4px 24px rgba(59,130,246,0.38);
  letter-spacing: 0.1px;
}

.btn-play-again:hover {
  transform: translateY(-2px);
  box-shadow: 0 7px 28px rgba(59,130,246,0.5);
}

.btn-play-again:active { transform: scale(0.97); }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 36px;
  left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: #1e293b;
  border: 1px solid rgba(255,255,255,0.09);
  color: #94a3b8;
  font-size: 13px;
  font-weight: 500;
  padding: 9px 22px;
  border-radius: 12px;
  opacity: 0;
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none;
  z-index: 200;
  white-space: nowrap;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── Confetti particles ── */
.particle {
  position: fixed;
  pointer-events: none;
  z-index: 99;
  border-radius: 50%;
  animation: particle-fly var(--dur) ease-out var(--delay) both;
}

@keyframes particle-fly {
  0%   { transform: translate(0, 0) scale(1); opacity: 1; }
  100% { transform: translate(var(--tx), var(--ty)) scale(0.2); opacity: 0; }
}
</style>
</head>

<body>

<div class="bg-orb"></div>
<div class="bg-orb"></div>
<div class="bg-orb"></div>

<div class="container">

  <div>
    <div class="title">GlowGrid</div>
    <div class="subtitle">Light them all</div>
  </div>

  <div class="date-nav">
    <button class="nav-btn" id="btn-prev" onclick="goDate(-1)" aria-label="Previous puzzle">‹</button>
    <div class="puzzle-label" id="puzzle-label"></div>
    <button class="nav-btn" id="btn-next" onclick="goDate(1)" aria-label="Next puzzle">›</button>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="moves-val">0</div>
      <div class="stat-label">Moves</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-value" id="streak-val">—</div>
      <div class="stat-label">Streak</div>
    </div>
  </div>

  <div class="grid" id="grid" role="grid" aria-label="GlowGrid puzzle"></div>

  <div class="actions">
    <button class="btn" onclick="resetPuzzle()">↺ Reset</button>
  </div>

</div>

<!-- Win overlay -->
<div class="win-overlay" id="win-overlay" role="dialog" aria-modal="true" aria-label="You won">
  <div class="win-card">
    <span class="win-emoji">✨</span>
    <div class="win-title">All lit up!</div>
    <div class="win-caption" id="win-caption">Well played.</div>
    <div class="win-grid" id="win-grid"></div>
    <div class="win-moves-line" id="win-moves-line"></div>
    <div class="win-streak" id="win-streak" style="display:none"></div>
    <div class="win-actions">
      <button class="btn-share" onclick="shareResult()">⎘ Share</button>
      <button class="btn-play-again" onclick="resetPuzzle()">↺ Try Again</button>
    </div>
  </div>
</div>

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<script>
const SIZE = 5;
const MAX_DAYS_BACK = 60;

let state = [];
let moves = 0;
let clickCounts = new Array(SIZE * SIZE).fill(0); // raw click count per cell
let cells = [];
let puzzleState = null; // initial state for current puzzle (for Reset)
let currentDateKey = ''; // "YYYY-M-D"

// ── Seeded PRNG (mulberry32) ─────────────────────────────────

function mulberry32(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ── Date helpers ─────────────────────────────────────────────

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

function dateFromKey(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function seedFromKey(key) {
  const [y, m, d] = key.split('-').map(Number);
  return y * 10000 + m * 100 + d;
}

function puzzleNumberFromKey(key) {
  const epoch = new Date('2025-01-01T00:00:00');
  const date = dateFromKey(key);
  return Math.max(1, Math.floor((date - epoch) / 86400000) + 1);
}

function formatDateLabel(key) {
  if (key === todayKey()) return 'Today';
  return dateFromKey(key).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function offsetDate(key, delta) {
  const d = dateFromKey(key);
  d.setDate(d.getDate() + delta);
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

// ── Streak ───────────────────────────────────────────────────

function getStreak() {
  return parseInt(localStorage.getItem('glowgrid-streak') || '0');
}

function tryUpdateStreak() {
  if (currentDateKey !== todayKey()) return false;

  const lastDate = localStorage.getItem('glowgrid-last-streak-date');
  const today = todayKey();
  if (lastDate === today) return false; // already counted today

  const streak = getStreak();
  const yesterday = offsetDate(today, -1);
  const newStreak = lastDate === yesterday ? streak + 1 : 1;

  localStorage.setItem('glowgrid-streak', newStreak);
  localStorage.setItem('glowgrid-last-streak-date', today);
  return true;
}

function refreshStreakDisplay() {
  const s = getStreak();
  document.getElementById('streak-val').textContent = s > 0 ? s : '—';
}

// ── Patterns ────────────────────────────────────────────────

function plusPattern(i) {
  const x = i % SIZE, y = Math.floor(i / SIZE);
  const r = [i];
  if (x > 0)        r.push(i - 1);
  if (x < SIZE - 1) r.push(i + 1);
  if (y > 0)        r.push(i - SIZE);
  if (y < SIZE - 1) r.push(i + SIZE);
  return r;
}

function crossPattern(i) {
  const x = i % SIZE, y = Math.floor(i / SIZE);
  const r = [i];
  if (x > 0 && y > 0)           r.push(i - SIZE - 1);
  if (x < SIZE-1 && y > 0)      r.push(i - SIZE + 1);
  if (x > 0 && y < SIZE-1)      r.push(i + SIZE - 1);
  if (x < SIZE-1 && y < SIZE-1) r.push(i + SIZE + 1);
  return r;
}

function affectedCells(i) {
  return state[i] ? plusPattern(i) : crossPattern(i);
}

function applyToggle(i) {
  affectedCells(i).forEach(j => { state[j] = !state[j]; });
}

// ── Rendering ────────────────────────────────────────────────

function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  cells = [];

  for (let i = 0; i < SIZE * SIZE; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell' + (state[i] ? ' on' : '');
    cell.setAttribute('role', 'gridcell');
    cell.setAttribute('tabindex', '0');
    cell.setAttribute('aria-pressed', state[i] ? 'true' : 'false');
    cell.style.setProperty('--idx', i);

    cell.addEventListener('mouseenter', () => previewCells(i));
    cell.addEventListener('mouseleave', clearPreview);
    cell.addEventListener('click', () => handleClick(i, cell));
    cell.addEventListener('keydown', e => handleKey(e, i));

    grid.appendChild(cell);
    cells.push(cell);
  }
}

function syncCells() {
  cells.forEach((cell, i) => {
    cell.className = 'cell' + (state[i] ? ' on' : '');
    cell.setAttribute('aria-pressed', state[i] ? 'true' : 'false');
  });
  document.getElementById('moves-val').textContent = moves;
}

function previewCells(i) {
  clearPreview();
  affectedCells(i).forEach(j => cells[j].classList.add('preview'));
}

function clearPreview() {
  cells.forEach(c => c.classList.remove('preview'));
}

// ── Interaction ──────────────────────────────────────────────

function handleClick(i, cell) {
  clickCounts[i]++;
  applyToggle(i);
  moves++;

  const ripple = document.createElement('div');
  ripple.className = 'ripple';
  cell.appendChild(ripple);
  ripple.addEventListener('animationend', () => ripple.remove(), { once: true });

  clearPreview();
  syncCells();
  previewCells(i);
  checkWin();
}

function handleKey(e, i) {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    handleClick(i, cells[i]);
    return;
  }
  const x = i % SIZE, y = Math.floor(i / SIZE);
  let next = -1;
  if (e.key === 'ArrowRight' && x < SIZE - 1) next = i + 1;
  if (e.key === 'ArrowLeft'  && x > 0)        next = i - 1;
  if (e.key === 'ArrowDown'  && y < SIZE - 1) next = i + SIZE;
  if (e.key === 'ArrowUp'    && y > 0)        next = i - SIZE;
  if (next >= 0) { e.preventDefault(); cells[next].focus(); }
}

// ── Puzzle generation ─────────────────────────────────────────
// Start from all-ON and shuffle — guarantees solvability.

function generatePuzzleForKey(key) {
  const rng = mulberry32(seedFromKey(key));
  state = Array(SIZE * SIZE).fill(true);
  for (let k = 0; k < 10; k++) {
    applyToggle(Math.floor(rng() * SIZE * SIZE));
  }
  puzzleState = state.slice();
}

// ── Win ──────────────────────────────────────────────────────

function checkWin() {
  if (!state.every(v => v)) return;

  const streakUpdated = tryUpdateStreak();
  refreshStreakDisplay();

  // Mini heatmap preview
  const winGrid = document.getElementById('win-grid');
  winGrid.innerHTML = '';
  const heatColors = [
    'rgba(255,255,255,0.04)',  // 0 — untouched
    '#bfdbfe',                  // 1 — blue-200 (light)
    '#60a5fa',                  // 2 — blue-400
    '#2563eb',                  // 3 — blue-600
    '#1e40af',                  // 4 — blue-800 (dark)
    '#1e3a8a',                  // 5+ — blue-900 (darkest)
  ];
  const glows = [
    'none',
    '0 0 6px rgba(191,219,254,0.5)',
    '0 0 8px rgba(96,165,250,0.55)',
    '0 0 8px rgba(37,99,235,0.6)',
    '0 0 9px rgba(30,64,175,0.65)',
    '0 0 10px rgba(30,58,138,0.7)',
  ];
  for (let i = 0; i < SIZE * SIZE; i++) {
    const n = clickCounts[i];
    const level = Math.min(n, heatColors.length - 1);
    const c = document.createElement('div');
    c.className = 'win-grid-cell';
    c.style.background = heatColors[level];
    c.style.boxShadow = glows[level];
    if (n > 0) c.textContent = n;
    winGrid.appendChild(c);
  }

  document.getElementById('win-moves-line').textContent =
    `Solved in ${moves} move${moves === 1 ? '' : 's'}`;
  document.getElementById('win-caption').textContent =
    moves <= 8 ? 'Flawless.' : moves <= 14 ? 'Well played.' : 'Nice one!';

  const streakEl = document.getElementById('win-streak');
  if (streakUpdated) {
    const s = getStreak();
    streakEl.textContent = s > 1 ? `🔥 ${s} day streak!` : '🔥 Streak started!';
    streakEl.style.display = 'inline-flex';
  } else {
    streakEl.style.display = 'none';
  }

  document.getElementById('win-overlay').classList.add('visible');
  spawnParticles();
}

// ── Share ─────────────────────────────────────────────────────

function shareResult() {
  const num = puzzleNumberFromKey(currentDateKey);
  const dateStr = formatDateLabel(currentDateKey);
  const rows = [];
  for (let r = 0; r < SIZE; r++) {
    let row = '';
    for (let c = 0; c < SIZE; c++) {
      const n = clickCounts[r * SIZE + c];
      row += n === 0 ? '⬛' : '🟦';
    }
    rows.push(row);
  }
  const streak = getStreak();
  const streakSuffix = currentDateKey === todayKey() && streak > 1 ? ` 🔥${streak}` : '';
  const text = [
    `GlowGrid #${num} · ${dateStr} ✨`,
    ...rows,
    `Solved in ${moves} move${moves === 1 ? '' : 's'}${streakSuffix}`,
  ].join('\n');

  navigator.clipboard.writeText(text)
    .then(() => showToast('Copied to clipboard!'))
    .catch(() => showToast('Copy failed — try again'));
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 2200);
}

// ── Particles ────────────────────────────────────────────────

function spawnParticles() {
  const colors = ['#60a5fa', '#a78bfa', '#34d399', '#fbbf24', '#f472b6', '#38bdf8'];
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;

  for (let i = 0; i < 48; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 5 + Math.random() * 9;
    const angle = Math.random() * Math.PI * 2;
    const dist = 100 + Math.random() * 220;
    p.style.cssText = `
      left: ${cx}px; top: ${cy}px;
      width: ${size}px; height: ${size}px;
      background: ${colors[i % colors.length]};
      --tx: ${(Math.cos(angle) * dist).toFixed(1)}px;
      --ty: ${(Math.sin(angle) * dist - 60).toFixed(1)}px;
      --dur: ${(0.55 + Math.random() * 0.9).toFixed(2)}s;
      --delay: ${(Math.random() * 0.15).toFixed(2)}s;
    `;
    document.body.appendChild(p);
    p.addEventListener('animationend', () => p.remove(), { once: true });
  }
}

// ── Navigation & reset ────────────────────────────────────────

function goDate(delta) {
  const candidate = offsetDate(currentDateKey, delta);
  const today = todayKey();
  const minDate = offsetDate(today, -MAX_DAYS_BACK);

  if (candidate > today) return;
  if (candidate < minDate) return;

  currentDateKey = candidate;
  loadCurrentPuzzle();
}

function resetPuzzle() {
  document.getElementById('win-overlay').classList.remove('visible');
  state = puzzleState.slice();
  moves = 0;
  clickCounts = new Array(SIZE * SIZE).fill(0);
  buildGrid();
}

function loadCurrentPuzzle() {
  generatePuzzleForKey(currentDateKey);

  const num = puzzleNumberFromKey(currentDateKey);
  const label = formatDateLabel(currentDateKey);
  document.getElementById('puzzle-label').textContent = `#${num} · ${label}`;

  const today = todayKey();
  const minDate = offsetDate(today, -MAX_DAYS_BACK);
  document.getElementById('btn-prev').disabled = currentDateKey <= minDate;
  document.getElementById('btn-next').disabled = currentDateKey === today;

  resetPuzzle();
  refreshStreakDisplay();
}

// ── Init ─────────────────────────────────────────────────────

currentDateKey = todayKey();
loadCurrentPuzzle();
</script>
